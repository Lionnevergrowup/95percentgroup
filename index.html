<link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Self-hosted fonts (SIL Open Font License, see fonts/OFL-*.txt).
   Andika is designed for beginning readers: single-story a and g, clear letter shapes. */
@font-face{font-family:'Andika';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/andika-400-latin.woff2) format('woff2')}
@font-face{font-family:'Andika';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/andika-700-latin.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:300 700;font-display:swap;src:url(fonts/fredoka-latin.woff2) format('woff2')}
:root{
  --ink:#2b2250; --ink-soft:#5f5886; --line:#d9d3f3;
  --bg1:#aee3ff; --bg2:#fff4d6;
  --purple:#6c4cf0; --purple-d:#4f33c9;
  --pink:#ff5fa2;   --pink-d:#d63f80;
  --orange:#ff9f1c; --orange-d:#d27a00;
  --yellow:#ffd23f; --yellow-d:#dcae00;
  --green:#22c07a;  --green-d:#15965c;
  --blue:#1f6fe0;   --blue-d:#1552b0;
  --teal:#18b8c9;   --teal-d:#0e8f9c;
  --red:#d63031;    --red-d:#a82224;
  --gold:#f5b700;   --gold-d:#c28f00;
  --font-ui:'Fredoka','Nunito','Trebuchet MS',system-ui,sans-serif,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji';
  --font-read:'Andika','Comic Sans MS','Chalkboard SE',system-ui,sans-serif,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji';
  --font-emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--font-ui);color:var(--ink);
  background-color:#d6f0ff;
  background-image:
    radial-gradient(ellipse 160px 60px at 12% 9%,rgba(255,255,255,.85) 60%,transparent 61%),
    radial-gradient(ellipse 110px 44px at 18% 6%,rgba(255,255,255,.85) 60%,transparent 61%),
    radial-gradient(ellipse 190px 64px at 86% 16%,rgba(255,255,255,.75) 60%,transparent 61%),
    radial-gradient(ellipse 120px 46px at 80% 12%,rgba(255,255,255,.75) 60%,transparent 61%),
    linear-gradient(180deg,var(--bg1) 0%,#d8f1ff 50%,var(--bg2) 100%);
  background-attachment:fixed;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overflow-x:hidden;
  -webkit-touch-callout:none;   /* no "Copy / Look Up" pop-up when a child long-presses */
  overscroll-behavior-y:contain; /* a downward swipe must not reload the page (Android pull-to-refresh) */
}
html{overscroll-behavior-y:contain}
button{font-family:inherit;color:inherit}
[hidden]{display:none!important}
.sound-card .pic,.word-card .wpic,.quiz-pic,.spell-pic,.sent-pic,.magic-pic,.trace-top .tp,.big-star,.hero-lion,
.mascot .lion,.act-card .ic,.brand .logo,.lesson-btn .sticker,.sticker-slot .st,.icon-btn,.listen,.spark{font-family:var(--font-emoji)}
#app{
  min-height:100vh;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(118px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}

/* ---------- buttons ---------- */
.btn{
  --c:var(--purple);--d:var(--purple-d);
  font-weight:600;font-size:clamp(1.1rem,3.4vw,1.35rem);border:0;border-radius:20px;padding:.55em 1.1em;min-height:58px;
  color:#fff;background:var(--c);box-shadow:0 6px 0 var(--d);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  transition:transform .08s,box-shadow .08s;text-shadow:0 1px 0 rgba(0,0,0,.15)
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--d)}
.btn.green{--c:var(--green);--d:var(--green-d)} .btn.blue{--c:var(--blue);--d:var(--blue-d)}
.btn.orange{--c:var(--orange);--d:var(--orange-d)} .btn.pink{--c:var(--pink);--d:var(--pink-d)}
.btn.teal{--c:var(--teal);--d:var(--teal-d)} .btn.red{--c:var(--red);--d:var(--red-d)}
/* bright backgrounds get dark text so it stays readable (WCAG contrast) */
.btn.green,.btn.orange,.btn.pink,.btn.teal{color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.btn.white{--c:#fff;--d:var(--line);color:var(--ink);text-shadow:none}
.btn.big{font-size:clamp(1.3rem,4.2vw,1.7rem);min-height:68px;padding:.5em 1.4em}
.icon-btn{
  flex:none;width:56px;height:56px;border-radius:50%;border:0;background:#fff;box-shadow:0 5px 0 var(--line);
  font-size:1.6rem;cursor:pointer;display:grid;place-items:center;transition:transform .08s,box-shadow .08s;padding:0
}
.icon-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar h1{margin:0}
.brand{flex:1;display:flex;align-items:center;gap:8px;font-size:clamp(1.5rem,5vw,2.3rem);font-weight:700;min-width:0}
.brand .logo{font-size:1.25em;animation:bob 3s ease-in-out infinite}
.brand-btn{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%;overflow:hidden;border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;border-radius:14px}
.brand-btn:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.brand .name{background:linear-gradient(90deg,var(--purple),var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.title{flex:1;font-size:clamp(1.3rem,4.5vw,2rem);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;background:#fff;border-radius:999px;padding:.3em .8em;font-weight:700;font-size:1.25rem;box-shadow:0 4px 0 var(--line);white-space:nowrap}

/* ---------- home ---------- */
.section-title{font-size:clamp(1.05rem,3vw,1.3rem);font-weight:700;margin:20px 4px 10px;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:16px 14px}
.lesson-btn{
  --c:var(--purple);--d:var(--purple-d);
  position:relative;aspect-ratio:1/1;min-height:100px;border-radius:30px;border:0;background:var(--c);box-shadow:0 7px 0 var(--d);color:#fff;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;transition:transform .08s,box-shadow .08s
}
.lesson-btn:active{transform:translateY(4px);box-shadow:0 3px 0 var(--d)}
.lesson-btn .num{font-size:clamp(2rem,6vw,2.6rem);font-weight:700;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.lesson-btn .letters{font-family:var(--font-read);font-weight:700;font-size:1.1rem;background:rgba(0,0,0,.2);border-radius:999px;padding:0 .55em;margin-top:5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.lesson-btn .letters.small{font-size:.9rem}
.dots{display:flex;gap:3px;margin-top:7px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots i.on{background:#fff}
.lesson-btn.ink{color:var(--ink)}
.lesson-btn.ink .num{text-shadow:0 2px 0 rgba(255,255,255,.35)}
.lesson-btn.ink .letters{background:rgba(255,255,255,.4)}
.lesson-btn.ink .dots i{background:rgba(43,34,80,.22)}
.lesson-btn.ink .dots i.on{background:var(--ink)}
.lesson-btn .sticker{position:absolute;top:-12px;right:-8px;font-size:2.1rem;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));animation:bob 2.6s ease-in-out infinite}
.lesson-btn.next{animation:pulse 1.6s ease-in-out infinite}
.lesson-btn.next::after{content:'▶';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);background:var(--yellow);color:var(--ink);font-size:.8rem;border-radius:999px;padding:2px 8px;box-shadow:0 3px 0 var(--yellow-d)}

/* ---------- lesson ---------- */
.lesson-hero{background:#fff;border-radius:30px;box-shadow:0 7px 0 var(--line);padding:16px;margin-bottom:22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.hero-sounds{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.hero-chip{font-family:var(--font-read);font-weight:700;font-size:clamp(2rem,7vw,2.8rem);line-height:1;min-width:68px;padding:.2em .4em;border:0;border-radius:18px;background:var(--yellow);box-shadow:0 5px 0 var(--yellow-d);cursor:pointer}
.hero-focus{font-size:1.15rem;color:var(--ink-soft);font-weight:600}
.hero-hf{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.hf-label{font-weight:600;color:var(--ink-soft)}
.hf-chip{font-family:var(--font-read);font-weight:700;font-size:1.25rem;border:0;border-radius:14px;padding:.15em .6em;background:#ffe3f0;box-shadow:0 4px 0 #f7b8d3;cursor:pointer}
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 16px}
.act-card{
  --c:var(--purple);
  position:relative;border:0;border-radius:28px;background:#fff;box-shadow:0 7px 0 var(--line);padding:18px 10px 14px;
  display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .08s,box-shadow .08s
}
.act-card:active{transform:translateY(4px);box-shadow:0 3px 0 var(--line)}
.act-card .ic{font-size:2.8rem;width:86px;height:86px;border-radius:50%;background:var(--c);display:grid;place-items:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.14)}
.act-card .nm{font-size:1.25rem;font-weight:700}
.act-card .step{position:absolute;top:10px;left:12px;width:30px;height:30px;border-radius:50%;background:#f1eefc;color:var(--ink-soft);font-weight:700;display:grid;place-items:center}
.act-card .check{position:absolute;top:6px;right:10px;font-size:1.7rem}
.act-card.done{background:#effff6;box-shadow:0 7px 0 #aee8cb}
.act-card.next{animation:pulse 1.6s ease-in-out infinite}

/* ---------- activity ---------- */
.act-title{font-size:clamp(1.1rem,3.6vw,1.6rem);font-weight:700;white-space:nowrap}
.progress{flex:1;min-width:60px;height:22px;background:#fff;border-radius:999px;box-shadow:inset 0 2px 5px rgba(0,0,0,.12);overflow:hidden}
.progress>i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--yellow),var(--orange));transition:width .45s}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:10px 0 4px;min-height:58vh}
.listen{width:88px;height:88px;border-radius:50%;border:0;background:var(--blue);box-shadow:0 7px 0 var(--blue-d);font-size:2.6rem;cursor:pointer;animation:pulse 2s ease-in-out infinite;flex:none}
.listen:active{transform:translateY(4px);box-shadow:0 3px 0 var(--blue-d)}
.cards{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}

.sound-card{
  width:clamp(124px,24vw,180px);aspect-ratio:3/4;border-radius:28px;background:#fff;border:0;box-shadow:0 8px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-family:var(--font-read)
}
.sound-card .glyph{font-size:clamp(3.2rem,10vw,5rem);font-weight:700;line-height:1.05}
.sound-card .pic{font-size:clamp(2.2rem,7vw,3.2rem);line-height:1.2}
.sound-card .kw{font-size:1.2rem;font-weight:700;color:var(--ink-soft)}
.cards.many{gap:12px}
.cards.many .sound-card{width:clamp(96px,21vw,150px);aspect-ratio:4/5}
.cards.many .sound-card .glyph{font-size:clamp(2.4rem,8vw,4rem)}
.cards.many .sound-card .pic{font-size:clamp(1.6rem,5.5vw,2.6rem)}
.cards.many .sound-card .kw{font-size:1rem}
.seen{background:#f1fff7!important;box-shadow:0 8px 0 #a3e6c4!important}

.balloons{display:flex;flex-wrap:wrap;gap:clamp(10px,3vw,30px);justify-content:center;padding:10px 0 40px}
.balloon{
  --c:var(--pink);position:relative;width:clamp(92px,19vw,138px);height:clamp(112px,23vw,168px);border:0;cursor:pointer;
  border-radius:50% 50% 47% 47%/56% 56% 44% 44%;color:#fff;font-family:var(--font-read);font-weight:700;font-size:clamp(2.4rem,8vw,3.8rem);
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.75) 0 7%,transparent 8%),var(--c);
  box-shadow:inset -8px -12px 0 rgba(0,0,0,.13);text-shadow:0 3px 0 rgba(0,0,0,.18);animation:float 3.2s ease-in-out infinite
}
.balloon::before{content:'';position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:8px solid transparent;border-bottom:10px solid var(--c);border-top:0}
.balloon::after{content:'';position:absolute;left:50%;top:100%;margin-top:1px;width:2px;height:40px;background:#8f88b8}
.balloon.pop{animation:pop .35s ease-out forwards}
.balloon.ink{color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.4)}
.balloon.bubble-word{
  border-radius:50%;width:clamp(118px,25vw,168px);height:clamp(118px,25vw,168px);font-size:clamp(1.6rem,5.6vw,2.5rem);
  background:radial-gradient(circle at 30% 27%,rgba(255,255,255,.9) 0 8%,transparent 9%),radial-gradient(circle,transparent 58%,rgba(255,255,255,.5) 70%,transparent 72%),var(--c);
  box-shadow:inset -6px -10px 0 rgba(0,0,0,.1),0 0 0 5px rgba(255,255,255,.55)
}
.balloon.bubble-word::before,.balloon.bubble-word::after{display:none}

.choices{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.choice{
  font-family:var(--font-read);font-size:clamp(2rem,7.5vw,3.4rem);font-weight:700;min-width:clamp(118px,25vw,200px);padding:.25em .6em;
  border:0;border-radius:24px;background:#fff;box-shadow:0 7px 0 var(--line);cursor:pointer
}
.choice.right{background:#d9ffe9;box-shadow:0 7px 0 #7fdcaa}
.quiz-pic{font-size:clamp(3.5rem,12vw,5.5rem);height:1.2em;line-height:1.2;opacity:0;transform:scale(.4);transition:.3s cubic-bezier(.2,1.6,.4,1)}
.quiz-pic.show{opacity:1;transform:none}

.word{font-family:var(--font-read);font-weight:700;font-size:clamp(2.4rem,9vw,4.2rem);line-height:1.1;display:inline-flex;letter-spacing:.02em}
.word .lt{display:inline-block;transition:transform .15s,color .15s;border-radius:10px;padding:0 .02em}
.word .lt.lit{color:var(--pink);transform:translateY(-8px) scale(1.15)}
.word.whole .lt{color:var(--purple)}
.word .lt.long{color:var(--pink);position:relative}
.word .lt.long::before{content:'';position:absolute;left:12%;right:12%;top:.08em;height:.08em;border-radius:9px;background:var(--pink)}
.word .lt.silent{color:#b8b1d8}
.word-card{
  border:0;border-radius:28px;background:#fff;box-shadow:0 8px 0 var(--line);padding:14px 22px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;min-width:clamp(130px,26vw,190px)
}
.word-card .arrow{font-size:1.4rem;color:#b35c00;font-weight:700}
.word-card .wpic{font-size:2.2rem;min-height:1.2em;line-height:1.2}

/* magic e */
.magic-box{display:flex;flex-direction:column;align-items:center;gap:16px;background:#fff;border-radius:30px;box-shadow:0 8px 0 var(--line);padding:22px 26px;min-width:min(100%,360px)}
.magic-word{display:flex;align-items:center;gap:6px}
.magic-word .word{font-size:clamp(3.2rem,13vw,5.5rem)}
.eslot{font-family:var(--font-read);font-weight:700;font-size:clamp(3.2rem,13vw,5.5rem);line-height:1.1;width:.9em;text-align:center;border:4px dashed #c9c0f0;border-radius:16px;color:transparent}
.wand{font-family:var(--font-read);font-size:clamp(1.6rem,5vw,2.2rem)}
.magic-pic{font-size:clamp(3rem,10vw,4.5rem);min-height:1.2em;line-height:1.2}

/* spelling */
.spell-pic{font-size:clamp(3.5rem,12vw,5rem);line-height:1.1;min-height:1.1em}
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.slot{
  width:clamp(58px,14vw,88px);height:clamp(70px,17vw,104px);border-radius:18px;border:4px dashed #bdb3ea;background:rgba(255,255,255,.65);
  font-family:var(--font-read);font-size:clamp(2.3rem,8.5vw,3.8rem);font-weight:700;display:grid;place-items:center
}
.slot.filled{border-style:solid;border-color:var(--green);background:#fff;animation:pop-in .25s}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:640px}
.tile{
  width:clamp(58px,14vw,88px);height:clamp(64px,15.5vw,94px);border-radius:18px;border:0;background:var(--yellow);box-shadow:0 7px 0 var(--yellow-d);
  font-family:var(--font-read);font-size:clamp(2.2rem,8vw,3.5rem);font-weight:700;cursor:pointer
}
.tile:active{transform:translateY(4px);box-shadow:0 3px 0 var(--yellow-d)}
.tile.used{visibility:hidden}

/* sentence */
.sent-pic{font-size:clamp(3.5rem,12vw,5rem);line-height:1.1}
.sent-pic.small{font-size:clamp(2.6rem,9vw,3.6rem)}
.sentence{display:flex;flex-wrap:wrap;gap:12px 12px;justify-content:center;font-family:var(--font-read);font-size:clamp(1.9rem,6.5vw,3.2rem);font-weight:700;max-width:900px}
.wchip{background:#fff;border:0;border-radius:16px;padding:.08em .35em;box-shadow:0 5px 0 var(--line);font:inherit;cursor:pointer;transition:transform .12s,background .12s}
.wchip.hl{background:var(--yellow);box-shadow:0 5px 0 var(--yellow-d);transform:translateY(-5px)}
.wchip.used{visibility:hidden}
.wslot{display:inline-block;min-height:1.35em;border:4px dashed #bdb3ea;border-radius:16px;background:rgba(255,255,255,.55);padding:0 .25em;text-align:center}
.wslot.filled{border-style:solid;border-color:var(--green);background:#fff;animation:pop-in .25s}
.wtext{display:inline-flex;align-items:center;padding:.08em 0}
.big-letter{font-family:var(--font-read);font-weight:700;font-size:clamp(3.4rem,11vw,5.2rem);line-height:1.1;min-width:1.4em;padding:0 .2em;text-align:center;
  background:#fff;border-radius:24px;box-shadow:0 7px 0 var(--line);color:var(--purple)}
.miss-word{background:#fff;border-radius:26px;box-shadow:0 7px 0 var(--line);padding:6px 26px}
.miss-word .word{font-size:clamp(3rem,11vw,4.8rem)}
.word .lt.gap{color:transparent;border:4px dashed #bdb3ea;border-radius:14px;min-width:.62em;text-align:center;margin:0 .06em}
.word .lt.found{color:var(--green-d);animation:pop-in .25s}
.tile.vowel{background:var(--pink);box-shadow:0 7px 0 var(--pink-d)}
/* sound sorting */
.sort-bins{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:clamp(8px,2vw,16px);width:min(100%,820px)}
.sort-bin{border:0;border-radius:20px;background:#5ab8f5;box-shadow:0 6px 0 #2f8fd1;min-height:clamp(130px,26vh,210px);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:inherit;color:var(--ink);transition:transform .12s}
.sort-bin.over{transform:scale(1.05);box-shadow:0 0 0 5px #fff,0 6px 0 #2f8fd1}
.sort-bin .lab{background:#d6efff;border:3px solid var(--ink);border-radius:12px;padding:0 .6em;font-family:var(--font-read);font-weight:700;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.2}
.sort-bin .kw{font-size:.9rem;font-weight:700;background:rgba(255,255,255,.75);border-radius:999px;padding:0 .5em}
.sort-bin .got{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:clamp(1.7rem,5.5vw,2.8rem);line-height:1.2}
.sort-bin .chip{animation:pop-in .25s}
.drawn{display:inline-block;width:1.15em;height:1.05em;vertical-align:-.15em}
.drawn svg{width:100%;height:100%;display:block}
.sort-tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:80px;max-width:820px}
.sort-card{position:relative;border:0;border-radius:18px;background:#fff;box-shadow:0 5px 0 var(--line);padding:6px 14px;font-size:clamp(2.2rem,8vw,3rem);line-height:1.2;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .2s;display:flex;flex-direction:column;align-items:center}
.sort-card .word{font-size:clamp(1.4rem,5vw,2rem)}
.sort-card .p{font-size:clamp(1.6rem,6vw,2.2rem)}
.sort-card.dragging{transition:none;z-index:60;box-shadow:0 12px 24px rgba(0,0,0,.25);cursor:grabbing}
.sort-card.picked{outline:5px solid var(--purple);outline-offset:2px}

/* tracing */
.trace-top{display:flex;align-items:center;gap:12px;font-family:var(--font-read);font-weight:700;font-size:clamp(1.3rem,4vw,1.8rem)}
.trace-top .tp{font-size:clamp(2.2rem,7vw,3rem)}
.trace-top .count{margin-left:6px;font-family:var(--font-ui);font-size:1.05rem;background:#fff;border-radius:999px;padding:.15em .7em;box-shadow:0 3px 0 var(--line);color:var(--ink-soft)}
.trace-wrap{position:relative;width:min(100%,760px);height:clamp(230px,50vh,520px);background:#fff;border-radius:30px;box-shadow:0 8px 0 var(--line);overflow:hidden;touch-action:none}
.trace-wrap canvas{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;touch-action:none}
.trace-wrap canvas.marks{pointer-events:none}
.trace-wrap.win{box-shadow:0 8px 0 #7fdcaa,0 0 0 6px #b8f5d4}

/* drawing */
.draw-tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.swatch{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 var(--line),inset 0 0 0 1px rgba(0,0,0,.18);cursor:pointer;padding:0;
  display:grid;place-items:center;color:#fff;font-size:1.3rem;font-weight:700;transition:transform .12s}
.swatch.light{color:var(--ink)}
.swatch.on{outline:4px solid var(--ink);outline-offset:2px;transform:scale(1.12)}
.swatch.on::after{content:'✓'}
.tool{width:48px;height:48px;border-radius:14px;border:0;background:#fff;box-shadow:0 4px 0 var(--line);font-size:1.4rem;cursor:pointer;display:grid;place-items:center;padding:0}
.tool.on{background:#e9e4ff;outline:3px solid var(--purple)}
.tool .dot{display:block;border-radius:50%;background:var(--ink)}
.stage.compact{gap:14px;justify-content:flex-start}
.draw-wrap{position:relative;width:min(100%,820px);height:clamp(210px,44vh,470px);background:#fff;border-radius:26px;box-shadow:0 8px 0 var(--line);overflow:hidden;touch-action:none}
.draw-wrap canvas{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.draw-label{position:absolute;left:50%;top:85%;transform:translate(-50%,-50%);white-space:nowrap;border:0;margin:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  font-family:var(--font-read);font-weight:700;font-size:clamp(1.5rem,4.6vw,2.2rem);line-height:1.35;color:var(--purple);background:rgba(255,255,255,.85);border-radius:14px;padding:0 .4em}
.draw-label[hidden]{display:none}
.draw-label.dragging{cursor:grabbing;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.draw-label .x{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--purple);color:#fff;font:700 12px/22px var(--font-ui);text-align:center}
.word-bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.word-bank .wchip{font-family:var(--font-read);font-size:clamp(1.3rem,4vw,1.8rem);font-weight:700}
.word-bank .wchip.on{background:#e9e4ff;box-shadow:0 5px 0 var(--purple)}
.word-bank.nudge{animation:shake .5s 2}

/* stickers */
.sticker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:16px}
.sticker-slot{border:0;border-radius:26px;background:rgba(255,255,255,.6);box-shadow:0 6px 0 var(--line);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.sticker-slot .st{font-size:3.4rem;line-height:1.1;filter:grayscale(1) opacity(.35)}
.sticker-slot.got{background:#fff}
.sticker-slot.got .st{filter:none}
.sticker-slot .lb{font-weight:600;color:var(--ink-soft)}

/* parents */
.panel-card{background:#fff;border-radius:24px;box-shadow:0 6px 0 var(--line);padding:18px 20px;margin-bottom:18px;-webkit-user-select:text;user-select:text}
.panel-card h2{margin:0 0 10px;font-size:1.35rem}
.panel-card p,.panel-card li{font-size:1.05rem;line-height:1.55;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.panel-card .note{color:var(--ink-soft)}
.version{font-size:.95rem;color:var(--ink-soft);text-align:center;margin:18px 0 6px}
.update-slot{display:flex;justify-content:center;margin:4px 0 12px}
.update-slot:empty{display:none}
.panel-card ul{padding-left:1.2em;margin:6px 0}
.seg{display:inline-flex;flex-wrap:wrap;gap:8px}
.seg button{border:0;border-radius:14px;padding:.45em .9em;font-size:1.05rem;font-weight:600;background:#f1eefc;cursor:pointer;min-height:44px}
.seg button.on{background:var(--purple);color:#fff}
.setting{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:10px 0}
.setting>label{font-weight:600;min-width:150px}
.setting select{font-size:1rem;padding:.4em;border-radius:10px;border:2px solid var(--line);max-width:100%}
.check-btn{border:0;background:none;font-size:1.5rem;line-height:1;padding:6px 10px;border-radius:10px;cursor:pointer;min-width:48px;min-height:44px}
.check-btn:hover,.check-btn:focus-visible{background:#f1eefc}
.check-btn.hand{box-shadow:inset 0 0 0 2px #d8d0ff}
input,textarea{-webkit-user-select:text;user-select:text}
.gate{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 14px}
.gate label{font-weight:600;font-size:1.15rem}
.gate input{font:inherit;font-size:1.8rem;font-weight:700;width:5em;text-align:center;padding:.2em;border:3px solid var(--line);border-radius:14px;color:var(--ink)}
.gate input:focus{outline:none;border-color:var(--purple)}
.gate .err{color:var(--red-d);font-weight:600;min-height:1.3em}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.prog{border-collapse:collapse;width:100%;min-width:560px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
table.prog th,table.prog td{padding:7px 8px;border-bottom:1px solid #eee9fb;text-align:center;font-size:.98rem}
table.prog th{background:#f6f4ff;position:sticky;top:0}
table.prog td.l{text-align:left}
table.prog td.l small{color:var(--ink-soft)}

/* mascot */
.mascot{transition-property:none!important;position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:8px;z-index:30;pointer-events:none;max-width:calc(100% - 20px)}
.mascot .lion{font-size:clamp(52px,12vw,70px);line-height:1;pointer-events:auto;cursor:pointer;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(0,0,0,.18));background:none;border:0;padding:0}
.mascot.talking .lion{animation:talk .28s ease-in-out infinite alternate}
.mascot .bubble{
  position:relative;background:#fff;border-radius:22px;padding:10px 16px;margin-bottom:24px;max-width:min(560px,calc(100vw - 110px));
  font-size:clamp(1rem,3.2vw,1.3rem);font-weight:600;box-shadow:0 4px 0 var(--line);opacity:0;transform:translateY(8px) scale(.96);transition:.25s
}
.mascot .bubble.show{opacity:1;transform:none}
.mascot .bubble::before{content:'';position:absolute;left:-10px;bottom:12px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.mascot .lion{touch-action:none;-webkit-user-drag:none}
.mascot.dragging .lion{animation:none;transform:scale(1.18) rotate(-6deg);cursor:grabbing;filter:drop-shadow(0 10px 8px rgba(0,0,0,.25))}
.mascot.flip{flex-direction:row-reverse}
.mascot.flip .bubble::before{left:auto;right:-10px;border:10px solid transparent;border-left-color:#fff;border-right:0}
.mascot.top{align-items:flex-start}
.mascot.top .bubble{margin-bottom:0;margin-top:14px}
.mascot.top .bubble::before{bottom:auto;top:12px}

/* overlays */
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(43,34,80,.45);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .2s;overflow-y:auto}
.overlay .panel{background:#fff;border-radius:34px;padding:26px 22px 24px;text-align:center;max-width:520px;width:100%;box-shadow:0 12px 0 rgba(0,0,0,.14);animation:pop-in .4s cubic-bezier(.2,1.6,.4,1)}
.overlay h1{margin:6px 0 4px;font-size:clamp(1.9rem,6vw,2.6rem)}
.overlay p{margin:0 0 18px;font-size:1.25rem;color:var(--ink-soft);font-weight:600}
.overlay .row{flex-direction:column}
.overlay .row .btn{width:100%}
.big-star{font-size:clamp(5rem,20vw,7rem);line-height:1;display:inline-block;animation:spin-in .9s cubic-bezier(.2,1.4,.4,1)}
.splash{background:linear-gradient(180deg,#aee3ff,#fff4d6)}
.splash .panel{background:transparent;box-shadow:none}
.splash .hero-lion{font-size:clamp(7rem,30vw,11rem);line-height:1;display:inline-block;animation:bob 2.4s ease-in-out infinite}
.splash h1{font-size:clamp(2.6rem,11vw,4.2rem);margin:6px 0;background:linear-gradient(90deg,var(--purple),var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}

/* effects */
.confetti{position:fixed;top:-24px;width:12px;height:18px;border-radius:3px;z-index:60;pointer-events:none;animation:fall linear forwards}
.spark{position:fixed;z-index:70;pointer-events:none;font-size:1.7rem;transform:translate(-50%,-50%);animation:spark .85s ease-out forwards}
.shake{animation:shake .45s!important}
.bounce{animation:bounce .45s}
.hint{animation:glow .9s ease-in-out infinite!important}
.fade{opacity:.2;pointer-events:none;transition:opacity .3s}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes talk{from{transform:rotate(-5deg) scale(1)}to{transform:rotate(5deg) scale(1.06)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes pop{40%{transform:scale(1.3)}100%{transform:scale(0);opacity:0}}
@keyframes pop-in{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px) rotate(-3deg)}40%{transform:translateX(10px) rotate(3deg)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.12) translateY(-6px)}70%{transform:scale(.96)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,210,63,.95),0 7px 0 var(--yellow-d);transform:scale(1)}50%{box-shadow:0 0 0 12px rgba(255,210,63,0),0 7px 0 var(--yellow-d);transform:scale(1.08)}}
@keyframes spin-in{from{transform:rotate(-200deg) scale(0)}to{transform:none}}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
@keyframes spark{to{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.4);opacity:0}}

@media (max-width:560px){
  .act-head .act-title .nm{display:none}
  .act-grid{grid-template-columns:repeat(2,1fr);gap:16px 12px}
  .lesson-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}
  .lesson-btn{min-height:0}   /* three across fit even a 320px screen */
  .icon-btn{width:46px;height:46px;font-size:1.3rem}
  .topbar{gap:7px}
  .brand .logo{display:none}
  .brand{font-size:1.35rem}
  .brand .name{overflow:hidden;text-overflow:ellipsis}
  .panel-card{padding:14px 12px}
  table.prog{min-width:0}
  table.prog th,table.prog td{padding:5px 3px;font-size:.8rem}
  table.prog th{font-size:.72rem}
  table.prog td.l{font-size:.85rem;overflow-wrap:anywhere}
  .check-btn{min-width:40px;padding:6px 4px;font-size:1.35rem}
  .pill{font-size:1.05rem;padding:.3em .6em}
}
/* phones held sideways and other short screens */
@media (max-height:520px){
  #app{padding-top:max(6px,env(safe-area-inset-top));padding-bottom:calc(58px + env(safe-area-inset-bottom))}
  .topbar{margin-bottom:6px}
  .icon-btn{width:44px;height:44px;font-size:1.25rem}
  .progress{height:16px}
  .stage{min-height:0;gap:10px;padding:2px 0}
  .stage.compact{gap:8px}
  .btn{min-height:46px;font-size:1.05rem;padding:.35em .9em}
  .btn.big{min-height:50px;font-size:1.2rem}
  .listen{width:58px;height:58px;font-size:1.7rem}
  .mascot .lion{font-size:42px}
  .mascot .bubble{font-size:.9rem;padding:6px 12px;margin-bottom:10px;max-width:min(440px,52vw)}
  .trace-top{display:none}
  .trace-wrap{height:calc(100vh - 142px);height:calc(100dvh - 142px);min-height:160px}
  .draw-tools{gap:5px}
  .swatch{width:32px;height:32px;border-width:3px}
  .tool{width:36px;height:36px;font-size:1.1rem}
  .draw-wrap{height:calc(100vh - 176px);height:calc(100dvh - 176px);min-height:140px}
  .word-bank .wchip{font-size:1.15rem}
  .slot{width:52px;height:62px;font-size:2.1rem}
  .tile{width:52px;height:56px;font-size:2rem}
  .spell-pic,.sent-pic,.sent-pic.small{font-size:2.4rem}
  .quiz-pic{font-size:2.6rem}
  .sentence{font-size:1.7rem;gap:8px}
  .balloons{padding:4px 0 34px}
  .balloon{width:88px;height:106px;font-size:2.3rem}
  .balloon.bubble-word{width:104px;height:104px;font-size:1.45rem}
  .sound-card{width:104px}
  .sound-card .glyph{font-size:2.6rem}
  .word-card{padding:8px 16px 6px}
  .word{font-size:2.2rem}
  .magic-box{padding:12px 18px;gap:8px}
  .magic-word .word,.eslot{font-size:3rem}
  .magic-pic{font-size:2.4rem}
  .choice{font-size:2rem}
  .lesson-hero{padding:10px;margin-bottom:12px;gap:6px}
  .overlay .panel{padding:14px 18px}
  .big-star{font-size:3.4rem}
  .overlay h1{font-size:1.6rem;margin:2px 0}
  .overlay p{margin-bottom:10px;font-size:1.05rem}
  .overlay .row{flex-direction:row;flex-wrap:wrap}
  .overlay .row .btn{width:auto}
  .splash .hero-lion{font-size:4.5rem}
  .splash h1{font-size:2.4rem;margin:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .hint,.shake{animation:none!important}
  .hint{outline:5px solid var(--yellow);outline-offset:3px}
}
</style>

function roundList(items, min, max){

    if (v && !(s.done[n] && s.done[n][k])){ (s.done[n] = s.done[n] || {})[k] = true; added = true; }

function restoreLeo(){
  const p = state.settings.leo;
  if (p && isFinite(p.fx) && isFinite(p.fy)) placeLeo(p.fx * innerWidth - (lionEl.offsetWidth || 64) / 2, p.fy * innerHeight - (lionEl.offsetHeight || 64) / 2, false);
}
function putLeoBack(){
  state.settings.leo = null; saveState();
  mascotEl.classList.remove('moved', 'flip', 'top');
  ['left', 'right', 'top', 'bottom'].forEach(k => { mascotEl.style[k] = ''; });
  bounce(lionEl);
}
(() => {
  let drag = null;
  const begin = (id, cx, cy) => { const r = lionEl.getBoundingClientRect(); drag = {id, cx, cy, x:r.left, y:r.top, moved:false}; };
  const moveTo = (cx, cy) => {
    if (!drag) return false;
    const dx = cx - drag.cx, dy = cy - drag.cy;
    if (!drag.moved && Math.hypot(dx, dy) < 8) return false;   // small wobble = still a tap
    if (!drag.moved){ drag.moved = true; mascotEl.classList.add('dragging'); }
    placeLeo(drag.x + dx, drag.y + dy, false);
    return true;
  };
  const finish = () => {
    if (!drag) return;
    if (drag.moved){
      leoDragged = true; setTimeout(() => { leoDragged = false; }, 60);
      mascotEl.classList.remove('dragging');
      if (leoAt) placeLeo(leoAt.x, leoAt.y, true);
      Sfx.pop(); bounce(lionEl);
    }
    drag = null;
  };
  if (window.PointerEvent){
    lionEl.addEventListener('pointerdown', e => { begin(e.pointerId, e.clientX, e.clientY); try { lionEl.setPointerCapture(e.pointerId); } catch (err) {} });
    lionEl.addEventListener('pointermove', e => { if (drag && e.pointerId === drag.id && moveTo(e.clientX, e.clientY)) e.preventDefault(); });
    lionEl.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) finish(); });
    lionEl.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) finish(); });
  } else {   // older iPads
    lionEl.addEventListener('touchstart', e => { const t = e.changedTouches[0]; begin(t.identifier, t.clientX, t.clientY); }, {passive:true});
    lionEl.addEventListener('touchmove', e => { const t = e.changedTouches[0]; if (moveTo(t.clientX, t.clientY)) e.preventDefault(); }, {passive:false});
    lionEl.addEventListener('touchend', finish);
    lionEl.addEventListener('touchcancel', finish);
  }
  window.addEventListener('resize', restoreLeo);
  restoreLeo();
})();
// text = what the bubble shows, speech = what Leo says (so answers are never shown as text)
// With "Show what Leo says" on, the bubble shows exactly what Leo says, so the game can be played with the sound off.
const caption = speech => (Array.isArray(speech) ? speech : [speech]).map(norm).filter(Boolean).join(' ');
let welcomeAt = -1;   // the screen (navId) of a game that carries on from where it was left
function say(text, speech){
  if (welcomeAt === navId){
    welcomeAt = -1;
    const sp = speech == null ? text : speech;
    speech = [T.welcomeBack, ...(Array.isArray(sp) ? sp : [sp])];
    text = SHOW.welcomeBack + ' ' + text;
  }
  lastSay = {text, speech};
  const my = ++sayCount;
  bubbleEl.textContent = state.settings.captions && speech != null ? caption(speech) : text;
  bubbleEl.classList.add('show');
  mascotEl.classList.add('talking');
  clearTimeout(bubbleTimer);
  return Speech.speak(speech == null ? text : speech)
    .then(() => {
      if (my !== sayCount) return;
      mascotEl.classList.remove('talking');
      if (!state.settings.captions) bubbleTimer = setTimeout(() => { if (my === sayCount) bubbleEl.classList.remove('show'); }, 6000);
    });
}

/* ---------- navigation ---------- */
let navId = 0, timers = [], cleanups = [], overlayEl = null;
function later(fn, ms){ const id = navId; const t = setTimeout(() => { if (id === navId) fn(); }, ms); timers.push(t); return t; }
function resetScope(){
  navId++;
  timers.forEach(clearTimeout); timers = [];
  cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = [];
  Speech.stop(); closeOverlay();
  mascotEl.classList.remove('talking');
}
function go(hash){ if (location.hash === hash || (hash === '#/' && !location.hash)) route(); else location.hash = hash; }
function mount(...nodes){ $('#app').replaceChildren(...nodes.flat(Infinity).filter(Boolean)); window.scrollTo(0, 0); }
function overlay(content, cls = ''){
  closeOverlay();
  const panel = h('div', {class:'panel', role:'dialog', 'aria-modal':'true'}, content);
  const title = panel.querySelector('h1');
  if (title){ title.id = 'dlg-title'; panel.setAttribute('aria-labelledby', 'dlg-title'); }
  overlayEl = h('div', {class:'overlay ' + cls}, panel);
  document.body.append(overlayEl);
  return overlayEl;
}
function closeOverlay(){ if (overlayEl){ overlayEl.remove(); overlayEl = null; } }

function route(){
  resetScope();
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] === 'lesson' && LESSON_BY_N[+parts[1]]){
    const l = LESSON_BY_N[+parts[1]];
    const a = parts[2] && ACTS.find(x => x.key === parts[2]);
    return a ? showActivity(l, a) : showLesson(l);
  }
  if (parts[0] === 'stickers') return showStickers();
  if (parts[0] === 'start') return showStart();
  if (parts[0] === 'parents') return showParents();
  showHome();
}

function soundGlyph(s){ return isMagicSound(s) ? s : s.toUpperCase() + s; }
function soundSay(s){
  const kw = SOUND[s][0];

  return `${L}. ${L} is for ${kw}.`;

// Every game remembers where it was after each question (ctx.save), so leaving it or reloading the page
// carries on from there (ctx.saved). Finishing the game forgets it; "↺" starts the game again.
function showActivity(l, a){
  const bar = h('i');
  const stage = h('div', {class:'stage'});
  const id = navId, key = l.n + '/' + a.key;
  const kept = state.resume[key];
  let over = false;
  const ctx = {
    lesson:l, stage, replay:null,
    saved: kept && kept.v === RESUME_V ? kept : null,
    alive: () => id === navId,
    progress: f => { bar.style.width = Math.round(Math.max(0, Math.min(1, f)) * 100) + '%'; },
    // where the game is, so a reload carries on from there (each game calls it once something is done)
    save: data => { if (id !== navId || over) return; state.resume[key] = Object.assign({v:RESUME_V, at:Date.now()}, data); saveState(); },
    forget: () => { if (id !== navId || over || !state.resume[key]) return; delete state.resume[key]; saveState(); },
    done: () => { if (id !== navId || over) return; over = true; delete state.resume[key]; finishActivity(l, a); },
  };
  Speech.preload(lessonPhrases(l), true);
  const again = ctx.saved ? h('button', {class:'icon-btn', 'aria-label':'Start this game again', title:'Start again', onclick:() => {
    Sfx.tap(); delete state.resume[key]; saveState(); route();
  }}, '↺') : null;
  mount(
    h('header', {class:'topbar act-head'},
      backBtn('#/lesson/' + l.n),
      h('h1', {class:'act-title', 'aria-label':`Lesson ${l.n}: ${actName(l, a)}`}, actIcon(l, a), ' ', h('span', {class:'nm'}, actName(l, a))),
      h('div', {class:'progress', role:'progressbar', 'aria-label':'Progress'}, bar),
      again,
      h('button', {class:'icon-btn', 'aria-label':'Hear again', onclick:() => { Sfx.tap(); if (ctx.replay) ctx.replay(); }}, '🔊')),
    stage);
  if (!ctx.saved){ a.run(ctx); return; }
  welcomeAt = navId;   // Leo's next line starts with "Welcome back!"
  try { a.run(ctx); }
  catch (e){   // a place saved by an older version that no longer fits: start the game fresh
    welcomeAt = -1; delete state.resume[key]; saveState(); ctx.saved = null; stage.replaceChildren(); a.run(ctx);
  }
}

function finishActivity(l, a){
  const first = !isDone(l.n, a.key);
  (state.done[l.n] = state.done[l.n] || {})[a.key] = true;
  saveState();
  Sfx.win(); confetti(60);
  const idx = ACTS.indexOf(a);
  const nextAct = ACTS.slice(idx + 1).find(x => !isDone(l.n, x.key)) || ACTS.slice(0, idx).find(x => !isDone(l.n, x.key));
  const nextLesson = LESSON_BY_N[l.n + 1];
  if (first && lessonComplete(l.n)){
    const [emo, name] = STICKERS[l.n - 1];
    overlay([
      h('div', {class:'big-star'}, emo),
      h('h1', {}, 'Lesson done!'),
      h('p', {}, P.gotSticker(name)),
      h('div', {class:'row'},
        nextLesson ? h('button', {class:'btn green big', onclick:() => go('#/lesson/' + nextLesson.n)}, `Lesson ${nextLesson.n} ➜`) : null,
        h('button', {class:'btn pink', onclick:() => go('#/stickers')}, '🏆 My stickers'),
        h('button', {class:'btn white', onclick:() => go('#/')}, '🏠 Home')),
    ]);
    say(`Hooray! You finished lesson ${l.n}! 🎉`, [T.hooray, P.finished(l.n), P.gotSticker(name)]);
    confetti(80);
    return;
  }
  overlay([
    h('div', {class:'big-star'}, '⭐'),
    h('h1', {}, pick(PRAISE)),
    h('p', {}, first ? 'You earned a star!' : 'You did it again!'),
    h('div', {class:'row'},
      nextAct ? h('button', {class:'btn green big', onclick:() => go(`#/lesson/${l.n}/${nextAct.key}`)}, actIcon(l, nextAct), ' ', actName(l, nextAct), ' ➜')
              : (nextLesson ? h('button', {class:'btn green big', onclick:() => go('#/lesson/' + nextLesson.n)}, `Lesson ${nextLesson.n} ➜`) : null),
      h('button', {class:'btn white', onclick:() => go('#/lesson/' + l.n)}, '📚 Lesson ' + l.n)),
  ]);
  say(first ? T.earnedStar + ' ⭐' : T.greatJob, first ? [T.greatJob, T.earnedStar] : T.greatJob);
}

// Reset all progress, after a simple sum only a grown-up can answer.
function confirmReset(){
  const a = 3 + Math.floor(Math.random() * 7), b = 3 + Math.floor(Math.random() * 7);
  const input = h('input', {type:'text', inputmode:'numeric', pattern:'[0-9]*', autocomplete:'off', 'aria-label':`What is ${a} plus ${b}?`});
  const err = h('div', {class:'err', role:'alert'});
  const doReset = () => {
    if (input.value.trim() !== String(a + b)){
      Sfx.bad(); err.textContent = input.value.trim() ? 'Not quite. Try again.' : 'Type the answer first.';
      wiggle(input); input.select(); return;
    }
    state.done = {}; state.check = {}; state.resume = {}; state.gen = Date.now(); saveState();   // a new generation: older copies are ignored
    route();   // redraw the parents page with everything cleared
    overlay([
      h('div', {class:'big-star'}, '🧹'),
      h('h1', {}, 'Progress cleared'),
      h('p', {}, 'All stars, stickers and ticks on this device were removed.'),
      h('div', {class:'row'}, h('button', {class:'btn green', onclick:closeOverlay}, 'OK')),
    ]);
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') doReset(); if (e.key === 'Escape') closeOverlay(); });
  overlay([
    h('div', {class:'big-star'}, '🗑️'),
    h('h1', {}, 'Reset all progress?'),
    h('p', {}, 'This removes every star, sticker and tick on this device. It cannot be undone.'),
    h('div', {class:'gate'}, h('label', {}, `Grown-ups only: what is ${a} + ${b}?`), input, err),
    h('div', {class:'row'},
      h('button', {class:'btn red', onclick:doReset}, '🗑️ Reset'),
      h('button', {class:'btn white', onclick:() => { Sfx.tap(); closeOverlay(); }}, 'Cancel')),
  ]);
  setTimeout(() => { try { input.focus(); } catch (e) {} }, 50);
}

// 1 · Sounds: tap the cards, then pop the balloon. Question types take turns:
// hear (Leo says the letter), begin (a picture: what sound does it start with?), case (big T: find little t),
// and in silent-e lessons vowel (Leo says cap or cape: a or a_e?).
// Sound sorting (the last game in Sounds): the boxes and the cards to sort into them.
// Letter lessons sort pictures by their first sound (up to 4 boxes; never both c and k, which sound the same).
// Silent-e lessons sort words by their vowel: short (cap) or long (cape); the final review sorts long words by vowel.
function sortSet(l){
  const per = isShort() ? 1 : 2;
  const magic = l.sounds.filter(isMagicSound);
  const longOf = w => w[firstVowel(w)].toLowerCase() + '_e';
  if (magic.length === 1){
    const s = magic[0], cards = shuffle(l.pairs).slice(0, isShort() ? 2 : 3).flatMap(([a, b]) => [{w:a, bin:s[0]}, {w:b, bin:s}]);
    return {kind:'vowel', bins:[s[0], s], cards:shuffle(cards)};
  }
  if (magic.length > 1){
    const pool = uniq(LESSONS.filter(x => x.pairs && x.n <= l.n).flatMap(x => x.pairs.map(p => p[1])));
    const cards = magic.flatMap(s => shuffle(pool.filter(w => longOf(w) === s)).slice(0, per).map(w => ({w, bin:s})));
    return {kind:'vowel', bins:magic, cards:shuffle(cards)};
  }
  let use = shuffle(l.sounds.filter(x => BEGIN_PICS[x]));
  if (use.includes('c') && use.includes('k')) use = use.filter(x => x !== 'k');
  use = use.slice(0, 4);
  if (use.length < 2) return null;
  const bins = l.sounds.filter(x => use.includes(x));   // in the lesson's order
  const cards = bins.flatMap(b => shuffle(BEGIN_PICS[b]).slice(0, per).map(([w, pic]) => ({w, pic, bin:b})));
  return {kind:'begin', bins, cards:shuffle(cards)};
}

function actSounds(ctx){
  const l = ctx.lesson, targets = l.sounds, magic = targets.some(isMagicSound), S = ctx.saved;
  const order = S ? S.order : isShort() ? roundList(targets, 3, 3) : roundList(targets, targets.length === 1 ? 4 : 6, 6);
  const plan = S ? S.plan : typePlan(order.length, magic ? ['hear', 'vowel'] : ['hear', 'begin', 'case']);
  const sorting = S ? S.sorting : sortSet(l);
  const total = order.length + 1 + (sorting ? 1 : 0);
  const keep = (stage, more) => ctx.save(Object.assign({order, plan, sorting, stage}, more));
  const seen = new Set();
  const playBtn = h('button', {class:'btn green big', hidden:true, onclick:() => { Sfx.tap(); round(0); }}, '🎈 Play ➜');
  const cards = targets.map(s => {
    const [kw, pic] = SOUND[s];
    const card = h('button', {class:'sound-card', 'aria-label':soundName(s), onclick:() => {
        Sfx.tap(); bounce(card); card.classList.add('seen'); seen.add(s);
        say(T.sayWithMe, soundSay(s));
        if (seen.size === targets.length) reveal(playBtn);
      }},
      h('span', {class:'glyph'}, soundGlyph(s)), h('span', {class:'pic'}, pic), h('span', {class:'kw'}, kw));
    return card;
  });
  if (S){ if (S.stage === 'sort' && sorting) sortGame(S.placed || []); else round(Math.min(S.r || 0, order.length)); }   // carry on
  else {
    ctx.stage.replaceChildren(h('div', {class:'cards' + (targets.length > 4 ? ' many' : '')}, cards), playBtn);
    ctx.progress(0);
    const intro = () => say(targets.length > 1 ? T.tapEachCard : T.tapTheCard);
    ctx.replay = intro; intro();
  }

  function round(r){
    if (r >= order.length){ if (sorting) sortGame([]); else { ctx.progress(1); later(ctx.done, 300); } return; }
    if (r > 0) keep('round', {r});   // kept once something is done
    ctx.progress((r + 1) / total);
    const target = order[r];
    let type = plan[r];
    if (type === 'begin' && !BEGIN_PICS[target]) type = 'case';
    const vpairs = (l.pairs || []).filter(p => isMagicSound(target) && p[1][firstVowel(p[1])].toLowerCase() === target[0]);
    if (type === 'vowel' && !vpairs.length) type = 'hear';
    let answer = target, opts, top = null, prompt, right, wrong;
    if (type === 'vowel'){
      // hear a word from the lesson: does the vowel say its sound (cap) or its name (cape)?
      const pair = pick(vpairs), long = Math.random() < 0.5, word = long ? pair[1] : pair[0];
      answer = long ? target : target[0];
      opts = shuffle([target[0], target, ...(hard(r) ? shuffle(MAGIC_SOUNDS.filter(x => x !== target)).slice(0, 1) : [])]);
      top = h('div', {class:'quiz-pic show'}, PIC[word] || '👂');
      prompt = () => say(SHOW.whichSound, [word, T.whichSound]);
      right = pr => [pr, word, P.thatIs(answer)];
      wrong = s => [P.thatIs(s), word, T.whichSound];
    } else if (type === 'begin'){
      const [word, pic] = pick(BEGIN_PICS[target]);
      opts = letterChoices(target, l, r);
      top = h('div', {class:'quiz-pic show', 'aria-label':word}, picEl(pic));
      prompt = () => say(SHOW.begin, [word, T.beginQ]);
      right = pr => [pr, P.startsWith(word)];
      wrong = s => [P.thatIs(s), word, T.beginQ];
    } else if (type === 'case'){
      opts = letterChoices(target, l, r);
      top = h('div', {class:'big-letter', 'aria-label':'big ' + target.toUpperCase()}, target.toUpperCase());
      prompt = () => say(SHOW.findLittle, P.findLittle(target));
      right = pr => [pr, P.bigLittle(target)];
      wrong = s => [P.thatIs(s), P.findLittle(target)];
    } else {
      opts = isMagicSound(target)
        ? shuffle([target, ...uniq([...shuffle(targets), ...shuffle(MAGIC_SOUNDS)]).filter(x => x !== target).slice(0, hard(r) ? 3 : 2)])
        : letterChoices(target, l, r);
      prompt = () => say(T.popBalloon, P.popLetter(target));
      right = pr => [pr, soundName(target)];
      wrong = s => [P.thatIs(s), P.find(target)];
    }
    quizHook(type, answer);
    const colors = ['var(--pink)','var(--blue)','var(--orange)','var(--green)','var(--purple)','var(--teal)'];
    let solved = false, misses = 0;
    const balloons = opts.map((s, i) => {
      const bc = colors[(i + r) % colors.length];
      const b = h('button', {class:'balloon' + (LIGHT_BG.has(bc) ? ' ink' : ''), 'aria-label':'balloon ' + s, style:{'--c':bc, animationDelay:(i * 0.4) + 's'}, onclick:e => {
        if (solved || !tapOK(e)) return;
        if (s === answer){
          solved = true; Sfx.pop(); Sfx.good(); b.classList.add('pop'); burst(b); fadeOthers(balloons, b);
          ctx.progress((r + 2) / total);
          const pr = pick(PRAISE);
          afterSay(say(pr, right(pr)), 1200, () => round(r + 1));
        } else {
          misses++; Sfx.bad(); wiggle(b);
          say(pick(TRY), wrong(s));
          if (misses >= 2) balloons[opts.indexOf(answer)].classList.add('hint');
        }
      }}, s);
      return b;
    });
    ctx.stage.replaceChildren(h('div', {class:'row'}, listenBtn(prompt), top), h('div', {class:'balloons'}, balloons));
    ctx.replay = prompt; prompt();
  }

  // Drag each card into its box, or tap a card and then a box. Tapping a card says its name.
  function sortGame(already){
    const {kind, bins, cards} = sorting;
    const done = cards.filter(c => already.includes(c.w)), todo = cards.filter(c => !already.includes(c.w));
    let left = todo.length, picked = null, misses = new Map();
    const placed = done.map(c => c.w);
    if (!todo.length){ ctx.progress(1); later(ctx.done, 300); return; }   // all sorted just before the page was left
    keep('sort', {placed});
    const said = c => Speech.speak(c.w);
    const boxes = bins.map(b => {
      const got = h('div', {class:'got'});
      const box = h('button', {class:'sort-bin', 'data-sound':b, 'aria-label':'Box ' + soundName(b), onclick:e => {
        if (!tapOK(e)) return;
        if (picked) drop(picked, box); else { Sfx.tap(); say(soundGlyph(b), soundName(b)); }
      }}, h('span', {class:'lab'}, b), kind === 'vowel' ? h('span', {class:'kw'}, SOUND[b][1] + ' ' + SOUND[b][0]) : null, got);
      box._got = got; box._sound = b;
      return box;
    });
    const tray = h('div', {class:'sort-tray'});
    const chipOf = c => h('span', {class:'chip'}, kind === 'begin' ? picEl(c.pic) : (PIC[c.w] || c.w));
    for (const c of done) boxes.find(b => b._sound === c.bin)._got.append(chipOf(c));   // sorted before the page was left
    const cardEls = todo.map(c => {
      const el = h('button', {class:'sort-card', 'data-word':c.w, 'aria-label':c.w, onclick:e => { if (e.detail === 0) choose(el); }},   // keyboard; touch and mouse below
        kind === 'begin' ? picEl(c.pic) : [PIC[c.w] ? h('span', {class:'p'}, PIC[c.w]) : null, wordEl(c.w, false)]);
      el._card = c;
      let start = null, moved = false, at = null;
      onStrokes(el, {
        down: p => { start = p; moved = false; },
        move: p => {
          if (!start) return;
          at = p;
          const dx = p.x - start.x, dy = p.y - start.y;
          if (!moved && Math.hypot(dx, dy) < 10) return;
          if (!moved){ moved = true; el.classList.add('dragging'); unpick(); said(c); }
          el.style.transform = `translate(${dx}px, ${dy}px)`;
          boxes.forEach(b => b.classList.toggle('over', hit(b, p)));
        },
        up: () => {
          if (!start) return;
          const p = at; start = null;
          boxes.forEach(b => b.classList.remove('over'));
          if (!moved){ choose(el); return; }
          el.classList.remove('dragging');
          const box = boxes.find(b => hit(b, p));
          if (box) drop(el, box); else snapBack(el);
        },
      }, {getBoundingClientRect: () => ({left:0, top:0})});
      return el;
    });
    const hit = (b, p) => { const r = b.getBoundingClientRect(); return p.x >= r.left && p.x <= r.right && p.y >= r.top && p.y <= r.bottom; };
    function unpick(){ if (picked){ picked.classList.remove('picked'); picked = null; } }
    function choose(el){
      if (!el.isConnected) return;
      const again = picked === el;
      unpick();
      if (again) return;
      picked = el; el.classList.add('picked'); Sfx.tap(); said(el._card);
    }
    function snapBack(el){ el.style.transform = ''; }
    function drop(el, box){
      const c = el._card;
      unpick();
      if (c.bin === box._sound){
        Sfx.good(); burst(box);
        el.remove(); left--; placed.push(c.w);
        box._got.append(chipOf(c));
        keep('sort', {placed});
        box.classList.remove('hint');
        ctx.progress((order.length + 1 + placed.length / cards.length) / total);
        if (!left){
          const pr = pick(PRAISE);
          afterSay(say(pr, [pr, kind === 'begin' ? P.startsWith(c.w) : c.w]), 1200, () => { ctx.progress(1); later(ctx.done, 300); });
        } else say(kind === 'begin' ? P.startsWith(c.w) : c.w + ' ✓', kind === 'begin' ? P.startsWith(c.w) : [c.w, P.thatIs(c.bin)]);
      } else {
        Sfx.bad(); snapBack(el); wiggle(el);
        const n = (misses.get(c.w) || 0) + 1; misses.set(c.w, n);
        say(pick(TRY), kind === 'begin' ? [c.w, T.beginQ] : [c.w, T.whichSound]);
        if (n >= 2) boxes.find(b => b._sound === c.bin).classList.add('hint');
      }
    }
    ctx.progress((order.length + 1 + placed.length / cards.length) / total);
    ctx.stage.replaceChildren(h('div', {class:'sort-bins', style:{'--n':bins.length}}, boxes), tray);
    tray.append(...cardEls);
    quizHook('sort', Object.fromEntries(todo.map(c => [c.w, c.bin])));
    const prompt = () => say(kind === 'begin' ? SHOW.sort : SHOW.sortVowels, kind === 'begin' ? T.sort : T.sortVowels);
    ctx.replay = prompt; prompt();
  }
}

// Trace items: letters are traced little then big (t, T); review lessons trace up to six little letters; silent-e lessons trace words.
function traceItems(l){
  if (l.pairs) return l.pairs.map(p => p[1]).concat(l.words || []).slice(0, 5);
  if (l.sounds.length <= 3) return l.sounds.flatMap(x => [x, x.toUpperCase()]);
  return shuffle(l.sounds).slice(0, 6);
}
/* ---------- handwriting strokes for tracing ---------- */
// Every letter is written stroke by stroke, in order, as in kindergarten handwriting (ball and stick).
// Units: the top line is y = 0, the dashed middle line y = 1, the baseline y = 2, the line below y = 3.
// Strokes are separated by "|", parts of one stroke by ",":
//   l x y x y ...          straight lines through the points
//   c cx cy r a0 a1        part of a circle from angle a0 to a1 (degrees: 0 = right, 90 = down; a1 < a0 goes counterclockwise)
//   e cx cy rx ry a0 a1    the same for an oval
//   d x y                  a dot (tap it)
const STROKES = {
  a:'c .5 1.5 .5 -20 -340 | l 1 1 1 2',           b:'l 0 0 0 2 | c .5 1.5 .5 180 530',
  c:'c .5 1.5 .5 -40 -320',                        d:'c .5 1.5 .5 -20 -340 | l 1 0 1 2',
  e:'l 0 1.5 1 1.5, c .5 1.5 .5 0 -315',           f:'c .65 .4 .35 -20 -180, l .3 .4 .3 2 | l 0 1 .75 1',
  g:'c .5 1.5 .5 -20 -340 | l 1 1 1 2.55, c .55 2.55 .45 0 160',
  h:'l 0 0 0 2 | c .45 1.45 .45 180 360, l .9 1.45 .9 2',
  i:'l 0 1 0 2 | d 0 .45',                         j:'l .5 1 .5 2.6, c .1 2.6 .4 0 165 | d .5 .45',
  k:'l 0 0 0 2 | l .8 1 .05 1.55 .85 2',           l:'l 0 0 0 2',
  m:'l 0 1 0 2 | c .38 1.4 .38 180 360, l .76 1.4 .76 2 | c 1.14 1.4 .38 180 360, l 1.52 1.4 1.52 2',
  n:'l 0 1 0 2 | c .45 1.45 .45 180 360, l .9 1.45 .9 2',
  o:'c .5 1.5 .5 -90 -450',                        p:'l 0 1 0 3 | c .5 1.5 .5 180 530',
  q:'c .5 1.5 .5 -20 -340 | l 1 1 1 3',            r:'l 0 1 0 2 | c .45 1.45 .45 180 300',
  s:'e .42 1.25 .4 .25 -20 -270, e .42 1.75 .42 .25 -90 160',
  t:'l .4 .25 .4 2 | l 0 1 .8 1',                  u:'l 0 1 0 1.55, c .45 1.55 .45 180 0, l .9 1.55 .9 1 | l .9 1 .9 2',
  v:'l 0 1 .5 2 1 1',                              w:'l 0 1 .35 2 .7 1 1.05 2 1.4 1',
  x:'l 0 1 1 2 | l 1 1 0 2',                       y:'l 0 1 .5 2 | l 1 1 .1 3',
  z:'l 0 1 1 1 0 2 1 2',
  A:'l .6 0 0 2 | l .6 0 1.2 2 | l .25 1.3 .95 1.3',
  B:'l 0 0 0 2 | l 0 0 .5 0, e .5 .5 .45 .5 -90 90, l .5 1 0 1 | l 0 1 .55 1, e .55 1.5 .5 .5 -90 90, l .55 2 0 2',
  C:'e .95 1 .95 1 -40 -320',                      D:'l 0 0 0 2 | l 0 0 .45 0, e .45 1 .8 1 -90 90, l .45 2 0 2',
  E:'l 0 0 0 2 | l 0 0 1 0 | l 0 1 .8 1 | l 0 2 1 2', F:'l 0 0 0 2 | l 0 0 1 0 | l 0 1 .8 1',
  G:'e .95 1 .95 1 -40 -360, l 1.9 1 1.2 1',       H:'l 0 0 0 2 | l 1.2 0 1.2 2 | l 0 1 1.2 1',
  I:'l .5 0 .5 2 | l 0 0 1 0 | l 0 2 1 2',         J:'l 1 0 1 1.5, e .55 1.5 .45 .5 0 180',
  K:'l 0 0 0 2 | l 1.05 0 .05 1.05 | l .35 .75 1.1 2', L:'l 0 0 0 2 1 2',
  M:'l 0 0 0 2 | l 0 0 .75 1.4 1.5 0 1.5 2',       N:'l 0 0 0 2 | l 0 0 1.2 2 1.2 0',
  O:'e .95 1 .95 1 -90 -450',                      P:'l 0 0 0 2 | l 0 0 .5 0, e .5 .5 .5 .5 -90 90, l .5 1 0 1',
  Q:'e .95 1 .95 1 -90 -450 | l 1.15 1.45 1.75 2.1',
  R:'l 0 0 0 2 | l 0 0 .5 0, e .5 .5 .5 .5 -90 90, l .5 1 0 1 | l .45 1 1.05 2',
  S:'e .55 .5 .5 .5 -20 -270, e .55 1.5 .55 .5 -90 160',
  T:'l .6 0 .6 2 | l 0 0 1.2 0',                   U:'l 0 0 0 1.4, e .6 1.4 .6 .6 180 0, l 1.2 1.4 1.2 0',
  V:'l 0 0 .6 2 1.2 0',                            W:'l 0 0 .45 2 .9 .4 1.35 2 1.8 0',
  X:'l 0 0 1.2 2 | l 1.2 0 0 2',                   Y:'l 0 0 .6 1 | l 1.2 0 .6 1 .6 2',
  Z:'l 0 0 1.2 0 0 2 1.2 2',
};
function letterStrokes(ch){
  return STROKES[ch].split('|').map(stroke => {
    const parts = stroke.split(',').map(p => p.trim().split(/\s+/));
    if (parts[0][0] === 'd') return {dot:true, pts:[[+parts[0][1], +parts[0][2]]]};
    const pts = [];
    for (const [kind, ...v] of parts){
      const n = v.map(Number);
      if (kind === 'l') for (let i = 0; i < n.length; i += 2) pts.push([n[i], n[i + 1]]);
      else {
        const [cx, cy, rx, ry, a0, a1] = kind === 'c' ? [n[0], n[1], n[2], n[2], n[3], n[4]] : n;
        const steps = Math.max(2, Math.ceil(Math.abs(a1 - a0) / 6));
        for (let i = 0; i <= steps; i++){ const a = (a0 + (a1 - a0) * i / steps) * Math.PI / 180; pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); }
      }
    }
    return {dot:false, pts: pts.filter((p, i) => !i || Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]) > 1e-6)};
  });
}
// A letter or word, letter after letter: its strokes (in units) and its width
function writeOut(text){
  let x = 0;

async function soundOut(we, word){

// Wrong answers for a word question: the silent-e partner first (cap for cape), then (in later rounds) the words that look most

  if (l.pairs){ const p = l.pairs.find(p => p.includes(target)); if (p){ const o = p[0] === target ? p[1] : p[0]; if (!bad(o)) out.push(o); } }
  const pools = [allWords(l), uniq(LESSONS.filter(x => x.n < l.n).flatMap(allWords)), hfWords(l)];
