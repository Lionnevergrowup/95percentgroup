      const gap = h('span', {class:'lt gap'}, '?');
      const word = h('span', {class:'word'}, [...target].map((ch, j) => j === vi ? gap : h('span', {class:'lt'}, ch)));
      // only vowels taught so far (at least two wrong ones, so there are always three choices)
      const taught = shuffle(taughtVowels(l)).filter(x => x !== v);
      const others = (taught.length >= 2 ? taught : uniq([...taught, ...shuffle([...'aeiou'])]).filter(x => x !== v)).slice(0, Math.max(2, Math.min(k, taught.length)));
      const opts = shuffle([v, ...others]);
      prompt = () => say(SHOW.missingLetter, [T.missingLetter, target]);
      const btns = opts.map(x => {
        const b = h('button', {class:'tile vowel', 'aria-label':'letter ' + x, onclick:e => {
          if (solved || !tapOK(e)) return;
          if (x === v){ gap.textContent = v; gap.classList.remove('gap'); gap.classList.add('found'); win(b, btns); }
          else {
            misses++; Sfx.bad(); wiggle(b);
            say(pick(TRY), [P.thatIs(x), T.missingLetter, target]);
            if (misses >= 2) btns[opts.indexOf(v)].classList.add('hint');
          }
        }}, x);
        return b;
      });
      quizHook(type, v);
      body = [h('div', {class:'miss-word'}, word), h('div', {class:'tiles'}, btns)];
    } else {
      const opts = shuffle([target, ...distractorWords(l, target, k, hard(r), type === 'picture' ? picOK : undefined)]);
      prompt = type === 'picture' ? () => say(SHOW.pictureWord, T.pictureWord) : () => say(T.listenTap, [T.findWord, target]);
      const btns = opts.map(w => {
        const b = h('button', {class:'choice', onclick:e => {
          if (solved || !tapOK(e)) return;
          if (w === target) win(b, btns);
          else {
            misses++; Sfx.bad(); wiggle(b);
            say(pick(TRY), type === 'picture' ? [w, T.pictureWord] : [w, T.findWord, target]);
            if (misses >= 2) btns[opts.indexOf(target)].classList.add('hint');
          }
        }}, wordEl(w));
        return b;
      });
      quizHook(type, target);
      body = [h('div', {class:'choices'}, btns)];
    }
    ctx.stage.replaceChildren(listenBtn(prompt), pic, ...body);
    ctx.replay = prompt; prompt();
  };
  round(opt.start || 0);
}
function actRead(ctx){
  const l = ctx.lesson;
  if (l.pairs) return actMagic(ctx);
  const words = l.words, S = ctx.saved;
  const quiz = S ? S.quiz : isShort() ? roundList(words, 3, 3) : roundList(words, 4, 6);
  const total = quiz.length + 1;
  const seen = new Set();
  const play = (start, plan) => wordQuiz(ctx, quiz, 1, total, () => { ctx.progress(1); later(ctx.done, 300); },
    {start, plan, keep:(r, p) => { if (r > 0) ctx.save({quiz, r, plan:p}); }});
  if (S) return play(S.r || 0, S.plan);   // carry on with the questions
  const playBtn = h('button', {class:'btn green big', hidden:true, onclick:() => { Sfx.tap(); play(0); }}, '🎮 Play ➜');
  const cards = words.map(w => {
    const we = wordEl(w, false);
    let busy = false;
    const card = h('button', {class:'word-card', 'aria-label':w, onclick:async () => {
        if (busy) return; busy = true; Sfx.tap();
        await soundOut(we, w);
        busy = false;
        if (!ctx.alive()) return;
        card.classList.add('seen'); seen.add(w);
        if (seen.size === words.length) reveal(playBtn);
      }},
      we, h('span', {class:'arrow'}, '• • ➜'), h('span', {class:'wpic'}, PIC[w] || ''));
    return card;
  });
  ctx.stage.replaceChildren(h('div', {class:'cards'}, cards), playBtn);
  ctx.progress(0);
  const intro = () => say(T.soundOut);
  ctx.replay = intro; intro();
}

// 3b · Magic e (silent-e lessons): add the e and hear the vowel change
function actMagic(ctx){
  const l = ctx.lesson, pairs = l.pairs, singles = l.words || [];
  const steps = pairs.length + singles.length, S = ctx.saved;
  const quiz = S ? S.quiz : shuffle(allWords(l)).slice(0, isShort() ? 3 : 8);
  const total = steps + quiz.length;
  let i = S ? (S.stage === 'quiz' ? steps : Math.min(S.i || 0, steps)) : 0;
  const learn = () => {
    if (i >= steps){
      const again = S && S.stage === 'quiz';
      wordQuiz(ctx, quiz, steps, total, () => { ctx.progress(1); later(ctx.done, 300); },
        {start: again ? S.r || 0 : 0, plan: again ? S.plan : null, keep:(r, p) => ctx.save({stage:'quiz', quiz, r, plan:p})});
      return;
    }
    if (i > 0) ctx.save({stage:'learn', quiz, i});
    ctx.progress(i / total);
    const nextBtn = h('button', {class:'btn green big', hidden:true, onclick:() => { Sfx.tap(); i++; learn(); }}, 'Next ➜');
    if (i < pairs.length){
      const [short, long] = pairs[i];
      const wordBox = h('div', {class:'magic-word'}, wordEl(short, false), h('span', {class:'eslot'}, 'e'));
      const pic = h('div', {class:'magic-pic'}, PIC[short] || '');
      let magicDone = false;
      const hear = () => magicDone
        ? say(`${short} ➜ ${long}`, [short, long])
        : say(T.tapMagic, [T.thisSays, short, T.tapMagic]);
      const wand = h('button', {class:'btn pink big wand', onclick:() => {
        if (magicDone) return;
        magicDone = true; Sfx.pop(); Sfx.good(); burst(wand); wand.hidden = true;
        const we = wordEl(long, true);
        wordBox.replaceChildren(we); bounce(we);
        pic.textContent = PIC[long] || '✨';
        reveal(nextBtn);
        say(`${short} ➜ ${long}`, [short, long, P.magicMakes(long[firstVowel(long)])]);
      }}, '✨ magic e');
      const again = h('button', {class:'btn white', onclick:() => { Sfx.tap(); hear(); }}, '🔊');
      ctx.stage.replaceChildren(h('div', {class:'magic-box'}, pic, wordBox, h('div', {class:'row'}, again, wand)), nextBtn);
      ctx.replay = hear; hear();
    } else {
      const w = singles[i - pairs.length];
      const we = wordEl(w, true);
      const hear = () => say(`${w} ✨`, [w, T.magicE]);
      ctx.stage.replaceChildren(h('div', {class:'magic-box'}, h('div', {class:'magic-pic'}, PIC[w] || '✨'), h('div', {class:'magic-word'}, we),
        h('button', {class:'btn white', onclick:() => { Sfx.tap(); bounce(we); hear(); }}, '🔊')), nextBtn);
      nextBtn.hidden = false;
      ctx.replay = hear; hear();
    }
  };
  learn();
}

// 4 · Sight words: tap the cards, then pop the bubble with the word you hear
function actSight(ctx){
  const l = ctx.lesson, words = hfWords(l), S = ctx.saved;
  const pool = uniq(LESSONS.filter(x => x.n <= l.n).flatMap(hfWords));
  const order = S ? S.order : isShort() ? roundList(words, 3, 3) : roundList(words, 5, 8);
  const total = order.length + 1;
  // hear: pop the word Leo says; all: pop every bubble with that word (2 or 3 of them). Later rounds use look-alike words.
  const plan = S ? S.plan : typePlan(order.length, ['hear', 'all']);
  if (S) return round(Math.min(S.r || 0, order.length));   // carry on with the bubbles
  const seen = new Set();
  const playBtn = h('button', {class:'btn green big', hidden:true, onclick:() => { Sfx.tap(); round(0); }}, '🔵 Play ➜');
  const cards = words.map(w => {
    const card = h('button', {class:'word-card', onclick:() => {
      Sfx.tap(); bounce(card); card.classList.add('seen'); seen.add(w);
      say(T.readWithMe, w);
      if (seen.size === words.length) reveal(playBtn);
    }}, wordEl(w, false));
    return card;
  });
  ctx.stage.replaceChildren(h('div', {class:'cards'}, cards), playBtn);
  ctx.progress(0);
  const intro = () => say(T.sightIntro);
  ctx.replay = intro; intro();

  function round(r){
    if (r >= order.length){ ctx.progress(1); later(ctx.done, 300); return; }
    if (r > 0) ctx.save({order, plan, r});
    ctx.progress((r + 1) / total);
    const target = order[r], type = plan[r];
    const pool2 = uniq([...words, ...pool]).filter(w => w !== target);
    const nOther = hard(r) ? 3 : 2, copies = type === 'all' ? (hard(r) ? 3 : 2) : 1;
    const look = hard(r) ? mostSimilar(target, pool2, 2) : [];
    const others = uniq([...look, ...shuffle(words), ...shuffle(pool)]).filter(w => w !== target).slice(0, nOther);
    const opts = shuffle([...Array(copies).fill(target), ...others]);
    const colors = ['var(--teal)','var(--pink)','var(--purple)','var(--blue)'];
    const prompt = type === 'all' ? () => say(SHOW.popAll, [T.popAll, target]) : () => say(T.popWordShow, [T.popWord, target]);
    quizHook(type, target);
    let solved = false, misses = 0, left = copies;
    const bubbles = opts.map((w, k) => {
      const bc = colors[(k + r) % colors.length];
      const b = h('button', {class:'balloon bubble-word' + (LIGHT_BG.has(bc) ? ' ink' : ''), style:{'--c':bc, animationDelay:(k * 0.35) + 's'},
        onclick:e => {
          if (solved || b.classList.contains('pop') || !tapOK(e)) return;
          if (w === target){
            Sfx.pop(); b.classList.add('pop'); b.classList.remove('hint');
            if (--left > 0){ Sfx.tick(copies - left); Speech.speak(target); return; }
            solved = true; Sfx.good(); burst(b); fadeOthers(bubbles, b);
            ctx.progress((r + 2) / total);
            const pr = pick(PRAISE);
            afterSay(say(pr, [pr, target]), 1200, () => round(r + 1));
          } else {
            misses++; Sfx.bad(); wiggle(b);
            say(pick(TRY), type === 'all' ? [w, T.popAll, target] : [w, T.popWord, target]);
            if (misses >= 2) bubbles.forEach((x, j) => { if (opts[j] === target && !x.classList.contains('pop')) x.classList.add('hint'); });
          }
        }}, w);
      return b;
    });
    ctx.stage.replaceChildren(listenBtn(prompt), h('div', {class:'balloons bubbles'}, bubbles));
    ctx.replay = prompt; prompt();
  }
}

// 5 · Spell it (write the words + dictation): hear the word, tap the letters in order
function spellWords(l){
  if (l.pairs){ return shuffle(l.pairs).slice(0, isShort() ? 2 : 3).flat(); }
  let w = allWords(l);
  if (w.length < 3) w = uniq([...w, ...hfWords(l).filter(x => x.length <= 4)]);
  return shuffle(w).slice(0, isShort() ? 3 : 6);
}
// Extra letter tiles. Later rounds add letters that look like the word's letters (b for d) and other vowels;
// letters that sound the same (c and k) are left out, so a word is never "spelled right" the wrong way.
function spellExtras(l, word, k, hardRound){
  const inWord = new Set([...word.toLowerCase()]);
  const skip = new Set([...(word.includes('I') ? 'li' : ''), ...[...inWord].flatMap(c => [...(SAME_SOUND[c] || '')])]);
  const ok = c => !inWord.has(c) && !skip.has(c);
  const look = hardRound ? shuffle(uniq([...inWord].flatMap(c => [...(LOOKALIKE[c] || ''), ...('aeiou'.includes(c) ? 'aeiou' : '')]))).filter(ok).slice(0, k - 1) : [];
  return uniq([...look, ...shuffle(l.sounds.filter(s => s.length === 1)), ...shuffle(ALPHA)]).filter(ok).slice(0, k);
}
function actSpell(ctx){
  const l = ctx.lesson, S = ctx.saved, list = S ? S.list : spellWords(l);
  const round = r => {
    if (r >= list.length){ ctx.progress(1); later(ctx.done, 300); return; }
    if (r > 0) ctx.save({list, r});
    ctx.progress(r / list.length);
    const word = list[r], chars = [...word];
    let pos = 0, misses = 0, solved = false;
    const slots = chars.map(() => h('div', {class:'slot'}));
    // the last two words are dictation: no picture until the word is spelled
    const dictation = list.length >= 4 && r >= list.length - 2;
    const pic = h('div', {class:'spell-pic'}, dictation || !PIC[word] ? '👂' : PIC[word]);
    const prompt = () => say(T.spellShow, [T.spellWord, word]);
    const extras = (r === 0 ? 1 : r < 3 ? 2 : 3) + (word.length === 1 ? 1 : 0);
    quizHook(dictation ? 'dictation' : 'spell', word);
    const tiles = shuffle([...chars, ...spellExtras(l, word, extras, hard(r))]).map(ch => {
      const t = h('button', {class:'tile', onclick:e => {
        if (solved || t.classList.contains('used') || !tapOK(e)) return;
        if (ch === chars[pos]){
          t.classList.add('used'); slots[pos].textContent = ch; slots[pos].classList.add('filled');
          pos++; misses = 0; Sfx.tick(pos);
          tiles.forEach(x => x.classList.remove('hint'));
          if (pos === chars.length){
            solved = true; Sfx.good(); burst(slotRow); fadeOthers(tiles, null);   // the word is done: the extra letters go
            if (PIC[word]) pic.textContent = PIC[word];
            ctx.progress((r + 1) / list.length);
            const pr = pick(PRAISE);
            afterSay(say(pr, [pr, ...chars.map(soundName), word]), 1400, () => round(r + 1));
          }
        } else {
          misses++; Sfx.bad(); wiggle(t);
          if (misses === 1) Speech.speak(word, {rate:0.8});
          if (misses >= 2){ const hint = tiles.find(x => !x.classList.contains('used') && x.textContent === chars[pos]); if (hint) hint.classList.add('hint'); }
        }
      }}, ch);
      return t;
    });
    const slotRow = h('div', {class:'slots'}, slots);
    ctx.stage.replaceChildren(h('div', {class:'row'}, listenBtn(prompt), pic), slotRow, h('div', {class:'tiles'}, tiles));
    ctx.replay = prompt; prompt();
  };
  round(S ? Math.min(S.r || 0, list.length) : 0);
}

// 6 · Sentence: read along, put the words in order, then find the missing word
function actSentence(ctx){
  const l = ctx.lesson, S = ctx.saved, sents = l.sentences.slice(0, S ? S.n : isShort() ? 1 : 2), total = sents.length * 3;
  let readTok = 0;
  const keep = (k, phase) => { if (k > 0 || phase !== 'read') ctx.save({n:sents.length, k, phase}); };
  const readPhase = k => {
    keep(k, 'read');
    ctx.progress((k * 3) / total);
    const [text, picture] = sents[k];
    const tokens = text.split(' ');
    const chips = tokens.map(t => h('button', {class:'wchip', onclick:e => {
      readTok++; chips.forEach(c => c.classList.remove('hl'));
      Sfx.tap(); bounce(e.currentTarget); Speech.speak(cleanWord(t));
    }}, t));
    const readAlong = async () => {
      const my = ++readTok, id = navId;
      for (let j = 0; j < chips.length; j++){
        if (my !== readTok || id !== navId) return;
        chips[j].classList.add('hl');
        await Speech.speak(cleanWord(tokens[j]), {rate:0.95});
        chips[j].classList.remove('hl');
        await wait(90);
      }
      if (my !== readTok || id !== navId) return;
      await wait(250);
      if (my === readTok && id === navId) Speech.speak(text, {rate:0.95});
    };
    ctx.stage.replaceChildren(
      h('div', {class:'sent-pic'}, picture),
      h('div', {class:'sentence'}, chips),
      h('div', {class:'row'},
        h('button', {class:'btn blue', onclick:() => { Sfx.tap(); readAlong(); }}, '🔊 Read to me'),
        h('button', {class:'btn green big', onclick:() => { readTok++; Sfx.good(); buildPhase(k); }}, '✅ I read it!')));
    ctx.replay = readAlong;
    const tok0 = readTok;
    say(T.readSentenceShow, T.readSentence).then(() => { if (ctx.alive() && readTok === tok0) readAlong(); });
  };
  const buildPhase = k => {
    keep(k, 'build');
    ctx.progress((k * 3 + 1) / total);
    const [text, picture] = sents[k];
    const tokens = text.split(' ');
    let order = shuffle(tokens.map((t, idx) => idx));
    for (let tries = 0; tries < 5 && tokens.length > 1 && order.every((v, idx) => v === idx); tries++) order = shuffle(order);
    let pos = 0, misses = 0, solved = false;
    const slots = tokens.map(t => h('span', {class:'wslot', style:{minWidth:(t.length * 0.62 + 0.6) + 'em'}}));
    const prompt = () => say(T.orderShow, [T.order, text]);
    const chips = order.map(idx => {
      const t = tokens[idx];
      const c = h('button', {class:'wchip', onclick:e => {
        if (solved || c.classList.contains('used') || !tapOK(e)) return;
        if (t === tokens[pos]){
          c.classList.add('used'); slots[pos].textContent = t; slots[pos].classList.add('filled');
          pos++; misses = 0; Sfx.tick(pos); chips.forEach(x => x.classList.remove('hint'));
          if (pos === tokens.length){
            solved = true; Sfx.good(); confetti(25);
            ctx.progress((k * 3 + 2) / total);
            const pr = pick(PRAISE);
            say(pr, [pr, text]).then(() => later(() => missPhase(k), 500));
          } else Speech.speak(cleanWord(t));
        } else {
          misses++; Sfx.bad(); wiggle(c);
          if (misses >= 2){ const hint = chips.find(x => !x.classList.contains('used') && x.textContent === tokens[pos]); if (hint) hint.classList.add('hint'); }
        }
      }}, t);
      return c;
    });
    ctx.stage.replaceChildren(h('div', {class:'row'}, listenBtn(prompt), h('div', {class:'sent-pic small'}, picture)),
      h('div', {class:'sentence'}, slots), h('div', {class:'sentence'}, chips));
    markShown();
    ctx.replay = prompt; prompt();
  };
  // one word is missing; the child reads the sentence and picks it from look-alike words
  const missPhase = k => {
    keep(k, 'miss');
    ctx.progress((k * 3 + 2) / total);
    const [text, picture] = sents[k];
    const tokens = text.split(' '), words = tokens.map(cleanWord);
    const idx = missingIndex(l, words), target = words[idx];
    const inSentence = new Set(words.map(w => w.toLowerCase()));
    const pool = uniq([...allWords(l), ...LESSONS.filter(x => x.n < l.n).flatMap(allWords), ...hfWords(l)]).filter(w => !inSentence.has(w.toLowerCase()) && w !== 'I' && w !== 'a');
    const fit = w => idx === 0 ? w[0].toUpperCase() + w.slice(1) : w;   // a first word starts with a capital
    let wrong = mostSimilar(target, pool, 2);
    if (wrong.length < 2){   // early lessons know few words: borrow look-alikes from later lessons
      const more = uniq(LESSONS.flatMap(allWords)).filter(w => !inSentence.has(w.toLowerCase()) && !wrong.includes(w) && w.length > 1);
      wrong = wrong.concat(mostSimilar(target, more, 2 - wrong.length));
    }
    const said = new Map(wrong.map(w => [fit(w), w]));   // Leo says a wrong word as it is recorded (cot, not Cot)
    const opts = shuffle([target, ...wrong.map(fit)]);
    const gap = h('span', {class:'wslot', style:{minWidth:(target.length * 0.62 + 0.6) + 'em'}});
    const shown = tokens.map((t, i) => i === idx ? h('span', {class:'wtext'}, gap, t.slice(target.length)) : h('span', {class:'wtext'}, t));
    const prompt = () => say(SHOW.missingWord, T.missingWord);
    quizHook('missing-word', target);
    let solved = false, misses = 0;
    const chips = opts.map(w => {
      const c = h('button', {class:'wchip', onclick:e => {
        if (solved || !tapOK(e)) return;
        if (w === target){
          solved = true; gap.textContent = w; gap.classList.add('filled'); c.classList.add('used'); Sfx.good(); confetti(20); fadeOthers(chips, c);
          ctx.progress((k * 3 + 3) / total);
          const pr = pick(PRAISE);
          say(pr, [pr, text]).then(() => later(() => { if (k + 1 < sents.length) readPhase(k + 1); else ctx.done(); }, 500));
        } else {
          misses++; Sfx.bad(); wiggle(c);
          say(pick(TRY), [said.get(w) || w, T.missingWord]);
          if (misses >= 2) chips[opts.indexOf(target)].classList.add('hint');
        }
      }}, w);
      return c;
    });
    ctx.stage.replaceChildren(h('div', {class:'row'}, listenBtn(prompt), h('div', {class:'sent-pic small'}, picture)),
      h('div', {class:'sentence'}, shown), h('div', {class:'sentence'}, chips));
    ctx.replay = prompt; prompt();
  };
  if (S && S.k < sents.length) ({read:readPhase, build:buildPhase, miss:missPhase}[S.phase] || readPhase)(S.k);
  else readPhase(0);
}

// The word to leave out: a lesson word if there is one, else a sight word, else the longest word (not the first word if possible)
function missingIndex(l, words){
  const lw = new Set(allWords(l).map(w => w.toLowerCase())), hw = new Set(hfWords(l).map(w => w.toLowerCase()));
  const score = i => { const w = words[i].toLowerCase(); return (lw.has(w) ? 6 : hw.has(w) ? 4 : 0) + (i > 0 ? 2 : 0) + Math.min(w.length, 5) * 0.1; };
  return words.map((w, i) => i).filter(i => words[i].length > 1).sort((a, b) => score(b) - score(a))[0] || 0;
}

// 7 · Draw and label
function actDraw(ctx){

      pick1(swatches, e.currentTarget);

    }}));
  const sizes = [['small brush', 6, 8], ['medium brush', 12, 14], ['large brush', 24, 22]].map(([name, s, dot]) => h('button', {class:'tool' + (s === size ? ' on' : ''),
    'aria-label':name, title:name, 'aria-pressed':String(s === size), onclick:e => {

  const clearBtn = h('button', {class:'tool', 'aria-label':'clear picture', title:'clear picture', onclick:() => {
    Sfx.tap(); pushHistory(); paintWhite(); hasInk = false; setLabel('', null); keepSoon();
  }}, '🗑️');
  // tap a word to label the picture; tap it again to take the label off
  const bank = h('div', {class:'word-bank', role:'group', 'aria-label':'Pick a word for your picture'}, words.map(w => h('button', {class:'wchip', 'aria-pressed':'false', onclick:() => {
    Sfx.tap();
    if (label === w){ setLabel(''); return; }
    setLabel(w); Speech.speak(w);
  }}, w)));
  function setLabel(w, pos){
    label = w || '';
    if (pos !== undefined) lpos = pos;
    labelText.textContent = label ? (PIC[label] ? PIC[label] + ' ' : '') + label : '';
    labelEl.hidden = !label;
    labelEl.setAttribute('aria-label', label ? `Label: ${label}. Tap to take it off.` : 'Label');
    [...bank.children].forEach(c => { const on = c.textContent === label; c.classList.toggle('on', on); c.setAttribute('aria-pressed', String(on)); });
    placeLabel(); keepSoon();
  }
  // keep the whole label inside the picture
  function placeLabel(){
    if (!label) return;
    const r = wrap.getBoundingClientRect(), lw = labelEl.offsetWidth, lh = labelEl.offsetHeight;
    if (!r.width || !r.height) return;
    let x = lpos ? lpos.fx * r.width : r.width / 2, y = lpos ? lpos.fy * r.height : r.height - 8 - lh / 2;
    // room for the ✕ badge at the top right
    x = lw + 14 >= r.width ? r.width / 2 : Math.max(lw / 2 + 4, Math.min(r.width - lw / 2 - 10, x));
    y = lh + 14 >= r.height ? r.height / 2 : Math.max(lh / 2 + 10, Math.min(r.height - lh / 2 - 4, y));
    labelEl.style.left = x + 'px'; labelEl.style.top = y + 'px';
    return {x, y};
  }
  let drag = null;
  onStrokes(labelEl, {
    down: p => { const c = placeLabel(); if (!c) return false; drag = {p, c, moved:false}; },
    move: p => {
      if (!drag) return;
      const dx = p.x - drag.p.x, dy = p.y - drag.p.y;
      if (!drag.moved && Math.hypot(dx, dy) < 8) return;   // a small wobble is still a tap
      if (!drag.moved){ drag.moved = true; labelEl.classList.add('dragging'); }
      const r = wrap.getBoundingClientRect();
      lpos = {fx:(drag.c.x + dx) / r.width, fy:(drag.c.y + dy) / r.height};
      const c = placeLabel();
      lpos = {fx:c.x / r.width, fy:c.y / r.height};
    },
    up: () => {
      if (!drag) return;
      const moved = drag.moved; drag = null; labelEl.classList.remove('dragging');
      Sfx.tap();
      if (!moved) setLabel(''); else keepSoon();
    },
  }, wrap);
  const saveBtn = h('button', {class:'tool', 'aria-label':'save picture', title:'save picture', onclick:() => { Sfx.tap(); savePicture(); }}, '💾');
  const doneBtn = h('button', {class:'btn green big', onclick:() => {
    if (!hasInk){ Sfx.bad(); wiggle(wrap); say(T.drawFirst); return; }
    if (!label){ Sfx.bad(); replayAnim(bank, 'nudge'); say(T.tapWordPic); return; }
    say('My picture: ' + label + '! 🎨', [T.yourPicture, label, T.greatDrawing]).then(() => later(ctx.done, 200));
  }}, '✅ Done');
  wrap.append(labelEl);
  ctx.stage.classList.add('compact');
  ctx.stage.replaceChildren(
    h('div', {class:'draw-tools'}, swatches, sizes, eraser, undoBtn, clearBtn, saveBtn),
    wrap, h('div', {class:'row'}, bank, doneBtn));
  ctx.progress(0);
  const intro = () => say(T.drawIntroShow, T.drawIntro);
  ctx.replay = intro; intro();

  let c2d = null, W = 0, H = 0, dpr = 1;
  function paintWhite(){ c2d.save(); c2d.setTransform(1, 0, 0, 1, 0, 0); c2d.fillStyle = '#fff'; c2d.fillRect(0, 0, cv.width, cv.height); c2d.restore(); }
  function pushHistory(){ try { history.push({img:c2d.getImageData(0, 0, cv.width, cv.height), ink:hasInk, label, lpos}); if (history.length > 8) history.shift(); } catch (e) {} }
  function layout(){
    const r = wrap.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const old = c2d && cv.width ? (() => { const t = document.createElement('canvas'); t.width = cv.width; t.height = cv.height; t.getContext('2d').drawImage(cv, 0, 0); return t; })() : null;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(r.width); H = Math.round(r.height);
    cv.width = W * dpr; cv.height = H * dpr;
    c2d = cv.getContext('2d');
    paintWhite();
    if (old) c2d.drawImage(old, 0, 0, cv.width, cv.height);
    c2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    history.length = 0;
    placeLabel();
  }
  function seg(a, b){
    c2d.strokeStyle = erasing ? '#fff' : color; c2d.lineWidth = erasing ? size * 2 : size;
    c2d.lineCap = 'round'; c2d.lineJoin = 'round';
    c2d.beginPath(); c2d.moveTo(a.x, a.y); c2d.lineTo(b.x, b.y); c2d.stroke();
  }
  onStrokes(cv, {
    down: p => { if (!c2d) return false; pushHistory(); drawing = true; last = p; seg(p, {x:p.x + 0.1, y:p.y}); if (!erasing) hasInk = true; },
    move: p => { if (!drawing) return; seg(last, p); last = p; },
    up: () => { drawing = false; keepSoon(); },
  });
  // the picture is kept (small, as a JPEG) a moment after each change, so a reload brings it back
  let keepTimer = 0, restoring = !!(S && S.img);
  function keepSoon(){
    if (restoring || !c2d) return;
    clearTimeout(keepTimer);
    keepTimer = later(() => {
      if (drawing) return keepSoon();
      const k = Math.min(1, 900 / Math.max(W, H)), t = document.createElement('canvas');
      t.width = Math.max(1, Math.round(W * k)); t.height = Math.max(1, Math.round(H * k));
      const o = t.getContext('2d'); o.fillStyle = '#fff'; o.fillRect(0, 0, t.width, t.height); o.drawImage(cv, 0, 0, t.width, t.height);
      let img = null; try { img = hasInk ? t.toDataURL('image/jpeg', 0.8) : null; } catch (e) {}
      if (img || label) ctx.save({img, ink:!!img, label, lpos}); else ctx.forget();
    }, 400);
  }
  function roundRect(o, x, y, w, ht, r){
    o.beginPath(); o.moveTo(x + r, y);
    o.arcTo(x + w, y, x + w, y + ht, r); o.arcTo(x + w, y + ht, x, y + ht, r);
    o.arcTo(x, y + ht, x, y, r); o.arcTo(x, y, x + w, y, r); o.closePath();
  }
  function savePicture(){
    // the word label is saved where it sits on the picture
    const out = document.createElement('canvas');
    out.width = cv.width; out.height = cv.height;
    const o = out.getContext('2d');
    o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height);
    o.drawImage(cv, 0, 0);
    const c = placeLabel();
    if (c){
      const r = wrap.getBoundingClientRect(), sx = cv.width / r.width, sy = cv.height / r.height;
      const lw = labelEl.offsetWidth * sx, lh = labelEl.offsetHeight * sy, x = c.x * sx, y = c.y * sy;
      o.fillStyle = 'rgba(255,255,255,.85)'; roundRect(o, x - lw / 2, y - lh / 2, lw, lh, 14 * sy); o.fill();
      const fs = parseFloat(getComputedStyle(labelText).fontSize) || 32;
      o.fillStyle = '#6c4cf0'; o.textAlign = 'center'; o.textBaseline = 'middle';
      o.font = `700 ${Math.round(fs * sy)}px Andika, 'Comic Sans MS', sans-serif`;
      o.fillText(labelText.textContent, x, y);
    }
    out.toBlob(blob => {
      if (!blob) return;
      const a = h('a', {href:URL.createObjectURL(blob), download:`phonics-lesson-${l.n}-${label || 'picture'}.png`});
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, 'image/png');
  }
  watchSize(wrap, () => { const r = wrap.getBoundingClientRect(); if (Math.round(r.width) !== W || Math.round(r.height) !== H) layout(); });
  layout();
  if (S){   // carry on with the picture from before the reload
    if (S.label && words.includes(S.label)) setLabel(S.label, S.lpos || null);
    if (!S.img){ restoring = false; return; }
    const img = new Image();
    img.onload = img.onerror = () => {
      restoring = false;
      if (!ctx.alive() || !img.naturalWidth || !c2d) return;
      c2d.save(); c2d.setTransform(1, 0, 0, 1, 0, 0); c2d.drawImage(img, 0, 0, cv.width, cv.height); c2d.restore();
      hasInk = !!S.ink;
    };
    img.src = S.img;
  }
}

/* ---------- version ---------- */
const versionText = () => `Version ${APP_VERSION.n} · ${APP_VERSION.date}`;
// Shown on the home and parents screens when the server has a newer version than this page.
const updateSlot = h('div', {class:'update-slot', role:'status'});
let lastCheck = 0;
function checkUpdate(){
  if (!window.fetch || Date.now() - lastCheck < 10 * 60 * 1000) return;   // at most every 10 minutes
  lastCheck = Date.now();
  fetch('index.html?check=' + Date.now(), {cache:'no-store'}).then(r => r.ok ? r.text() : '').then(t => {
    const m = /var APP_VERSION = \{n:(\d+), date:'([^']*)'\}/.exec(t);
    if (m && +m[1] > APP_VERSION.n) updateSlot.replaceChildren(
      h('button', {class:'btn orange', onclick:() => forceRefresh()}, `🔄 New version ${m[1]} is ready. Tap to update!`));
  }).catch(() => {});
}

/* ---------- force refresh ---------- */
async function forceRefresh(){
  Speech.stop();
  overlay([h('div', {class:'big-star'}, '🔄'), h('h1', {}, 'Updating…'), h('p', {}, 'Getting the newest version')]);
  const base = location.pathname.replace(/[^/]*$/, '');
  const urls = [location.pathname, base + 'index.html', base + 'audio/manifest.js', base + 'fonts/andika-700-latin.woff2', base + 'fonts/fredoka-latin.woff2'];
  try {
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
    await Promise.race([Promise.all(urls.map(u => fetch(u, {cache:'reload'}).catch(() => {}))), wait(6000)]);
  } catch (e) {}
  location.replace(location.pathname + '?v=' + Date.now() + location.hash);
}

/* =====================================================================
   PHRASES — every line Leo can say (tools/build_audio.py records these)
   ===================================================================== */
const SOUND_KEYS = Object.keys(SOUND);
function globalPhrases(){
  return uniq([
    ...Object.values(T), ...PRAISE, ...TRY,
    ...SOUND_KEYS.flatMap(x => [soundName(x), P.thatIs(x), P.find(x)]),
    ...ALPHA.map(c => c.toUpperCase()),
    ...DRAW_COLORS.map(c => c[0]),
    ...uniq(LESSONS.flatMap(l => ACTS.map(a => P.playAct(actName(l, a))))),
  ].map(norm).filter(Boolean));
}
function lessonPhrases(l){
  const name = STICKERS[l.n - 1][1];
  return uniq([
    P.lesson(l.n), P.playLesson(l.n), P.finished(l.n), P.gotSticker(name), P.aSticker(name), P.finishFor(l.n), P.haveStickers(l.n),
    ...l.sounds.flatMap(x => [soundSay(x), P.popLetter(x), P.thatIs(x), P.find(x), soundName(x)]),
    ...l.sounds.filter(x => !isMagicSound(x)).flatMap(x => [P.findLittle(x), P.bigLittle(x), ...(BEGIN_PICS[x] || []).flatMap(([w]) => [w, P.startsWith(w)])]),
    ...uniq(allWords(l).join('').split('')).map(soundName),
    ...ACTS.map(a => P.playAct(actName(l, a))),
    ...allWords(l), ...hfWords(l),
    ...(l.pairs || []).map(p => P.magicMakes(p[1][firstVowel(p[1])])),
    ...l.sentences.flatMap(([text]) => [text, ...text.split(' ').map(cleanWord)]),
  ].map(norm).filter(Boolean));
}
const allPhrases = () => uniq([...globalPhrases(), ...LESSONS.flatMap(lessonPhrases)]);
window.__phonicsPhrases = allPhrases;

/* =====================================================================
   START
   ===================================================================== */
Speech.init();
// Browsers only allow sound after a tap. The first tap turns it on (pages opened without the start
// screen), and a tap after iOS blocked audio (a call, time in the background) turns it back on.
// Only these events count as a tap for that: pointerdown does not for touch.
const activateAudio = () => {
  if (!audioUnlocked){
    audioUnlocked = true; Speech.unlock(); Sfx.ensure();
    Speech.preload([...Object.values(T), ...PRAISE, ...TRY]);
  } else if (Speech.blocked){ Speech.blocked = false; Speech.unlock(); Sfx.ensure(); }
  else Sfx.ensure();   // resumes the audio if the phone paused it
  Music.start();       // no-op when it is already playing or switched off
};
['pointerup', 'touchend', 'click', 'keydown'].forEach(t => document.addEventListener(t, activateAudio, true));
if (/[?&]v=\d+/.test(location.search)) try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (document.hidden){ Speech.stop(); Music.stop(); } else { Music.start(); checkUpdate(); } });
route();
if (!/^#\/(parents|start)/.test(location.hash)) showStart();   // #/start shows it via route()
checkUpdate();
// IndexedDB brought back something the other two lost: redraw the screen (under the start screen, Play redraws it)
if (window.__quiz) window.__app = {state, saveState, IDB, totalStars, RESUME_V};   // test hook
restoreSaved(() => { if (!(overlayEl && overlayEl.classList.contains('splash')) && !/^#\/lesson\/\d+\/\w/.test(location.hash)) route(); });
})();
</script>
