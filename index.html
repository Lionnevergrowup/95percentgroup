// 1 · Sounds: tap the cards, then pop the balloon with the sound you hear
function actSounds(ctx){
  const l = ctx.lesson, targets = l.sounds;
  const order = roundList(targets, targets.length === 1 ? 4 : 6, 6);
  const total = order.length + 1;
  const seen = new Set();
  const playBtn = h('button', {class:'btn green big', hidden:true, onclick:() => { Sfx.tap(); round(0); }}, '🎈 Play ➜');
  const cards = targets.map(s => {
    const [kw, pic] = SOUND[s];
    const card = h('button', {class:'sound-card', 'aria-label':soundName(s), onclick:() => {
        Sfx.tap(); bounce(card); card.classList.add('seen'); seen.add(s);
        say(T.sayWithMe, soundSay(s));
        if (seen.size === targets.length) reveal(playBtn);
      }},
      h('span', {class:'glyph'}, soundGlyph(s)), h('span', {class:'pic'}, pic), h('span', {class:'kw'}, kw));
    return card;
  });
  ctx.stage.replaceChildren(h('div', {class:'cards' + (targets.length > 4 ? ' many' : '')}, cards), playBtn);
  ctx.progress(0);
  const intro = () => say(targets.length > 1 ? T.tapEachCard : T.tapTheCard);
  ctx.replay = intro; intro();

  function round(r){
    if (r >= order.length){ ctx.progress(1); later(ctx.done, 300); return; }
    ctx.progress((r + 1) / total);
    const target = order[r];
    const pool = isMagicSound(target)
      ? uniq([...targets, ...shuffle(MAGIC_SOUNDS)]).filter(x => x !== target)
      : uniq([...shuffle(targets), ...shuffle(ALPHA)]).filter(x => x !== target);
    const opts = shuffle([target, ...pool.slice(0, 3)]);
    const colors = ['var(--pink)','var(--blue)','var(--orange)','var(--green)','var(--purple)','var(--teal)'];
    const prompt = () => say(T.popBalloon, P.popLetter(target));
    let solved = false, misses = 0;
    const balloons = opts.map((s, i) => {
      const b = h('button', {class:'balloon', 'aria-label':'balloon ' + s, style:{'--c':colors[(i + r) % colors.length], animationDelay:(i * 0.4) + 's'}, onclick:() => {
        if (solved) return;
        if (s === target){
          solved = true; Sfx.pop(); Sfx.good(); b.classList.add('pop'); burst(b);
          ctx.progress((r + 2) / total);
          const pr = pick(PRAISE);
          afterSay(say(pr, [pr, soundName(target)]), 1200, () => round(r + 1));
        } else {
          misses++; Sfx.bad(); wiggle(b);
          say(pick(TRY), [P.thatIs(s), P.find(target)]);
          if (misses >= 2) balloons[opts.indexOf(target)].classList.add('hint');
        }
      }}, s);
      return b;
    });
    ctx.stage.replaceChildren(listenBtn(prompt), h('div', {class:'balloons'}, balloons));
    ctx.replay = prompt; prompt();
  }
}

// 2 · Trace: trace letters (or silent-e words) with a finger
function traceItems(l){
  if (l.pairs) return l.pairs.map(p => p[1]).concat(l.words || []).slice(0, 5);
  const s = l.sounds.length > 5 ? shuffle(l.sounds).slice(0, 5) : l.sounds;
  return s.length <= 3 ? [...s, ...s] : s;
}
function actTrace(ctx){
  const l = ctx.lesson, items = traceItems(l);
  let i = 0, fails = 0, won = false, drawing = false, last = null, hue = 260;
  const wrap = h('div', {class:'trace-wrap'});
  const guide = h('canvas', {'aria-hidden':'true'}), ink = h('canvas', {'aria-label':'Tracing area'});
  wrap.append(guide, ink);
  const topPic = h('span', {class:'tp'}), topLabel = h('span');
  const clearBtn = h('button', {class:'btn orange', onclick:() => { Sfx.tap(); clearInk(); }}, '🧽 Clear');
  const doneBtn = h('button', {class:'btn green', onclick:() => check(true)}, '✔ Done');
  ctx.stage.replaceChildren(h('div', {class:'trace-top'}, topPic, topLabel), wrap, h('div', {class:'row'}, clearBtn, doneBtn));

  let W = 0, H = 0, dpr = 1, gctx, ictx, brush = 20, size = 100, mask = [], tol = null, mw = 0, mh = 0;
  const small = document.createElement('canvas');
  const font = px => `700 ${px}px Andika, 'Comic Sans MS', 'Chalkboard SE', sans-serif`;

  function layout(){
    const r = wrap.getBoundingClientRect();
    if (!r.width || !r.height) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(r.width); H = Math.round(r.height);
    for (const c of [guide, ink]){ c.width = W * dpr; c.height = H * dpr; }
    gctx = guide.getContext('2d');
    ictx = ink.getContext('2d');
    gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ictx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawGuide();
  }
  function drawGuide(done){
    const text = items[i];
    gctx.font = font(100);
    const asc = gctx.measureText('l').actualBoundingBoxAscent || 75;
    const desc = gctx.measureText('g').actualBoundingBoxDescent || 25;
    const xh = gctx.measureText('x').actualBoundingBoxAscent || 50;
    const wid = gctx.measureText(text).width || 60;
    size = Math.min(H * 0.8 / ((asc + desc) / 100), W * 0.84 / (wid / 100));
    const A = asc * size / 100, D = desc * size / 100, X = xh * size / 100;
    const base = (H - (A + D)) / 2 + A, cx = W / 2;
    gctx.clearRect(0, 0, W, H);
    // handwriting lines: top, dashed middle, baseline
    gctx.lineWidth = 3; gctx.lineCap = 'round';
    gctx.strokeStyle = '#c7dcff'; gctx.setLineDash([]); hline(base - A);
    gctx.setLineDash([14, 12]); hline(base - X);
    gctx.setLineDash([]); gctx.strokeStyle = '#ffb3be'; hline(base);
    gctx.strokeStyle = '#c7dcff'; hline(base + D);
    // the letter to trace
    gctx.font = font(size); gctx.textAlign = 'center'; gctx.textBaseline = 'alphabetic';
    gctx.fillStyle = done ? '#bff3d8' : '#ebe7fc';
    gctx.fillText(text, cx, base);
    gctx.setLineDash([2, Math.max(6, size * 0.05)]);
    gctx.lineWidth = Math.max(3, size * 0.014); gctx.strokeStyle = done ? '#22c07a' : '#a597ee';
    gctx.strokeText(text, cx, base);
    gctx.setLineDash([]);
    // masks for checking (half resolution)
    brush = Math.max(14, size * 0.12);
    mw = Math.ceil(W / 2); mh = Math.ceil(H / 2);
    const mc = document.createElement('canvas'); mc.width = mw; mc.height = mh;
    const m = mc.getContext('2d', {willReadFrequently:true});
    m.setTransform(0.5, 0, 0, 0.5, 0, 0);
    m.font = font(size); m.textAlign = 'center'; m.textBaseline = 'alphabetic'; m.fillStyle = '#000';
    m.fillText(text, cx, base);
    const md = m.getImageData(0, 0, mw, mh).data;
    m.lineJoin = 'round'; m.lineWidth = brush * 1.6 + size * 0.04; m.strokeStyle = '#000';
    m.strokeText(text, cx, base);
    const td = m.getImageData(0, 0, mw, mh).data;
    mask = []; tol = new Uint8Array(mw * mh);
    for (let p = 0; p < mw * mh; p++){ if (md[p * 4 + 3] > 128) mask.push(p); if (td[p * 4 + 3] > 30) tol[p] = 1; }
    small.width = mw; small.height = mh;
  }
  function hline(y){ gctx.beginPath(); gctx.moveTo(16, y); gctx.lineTo(W - 16, y); gctx.stroke(); }
  function clearInk(){ if (ictx){ ictx.clearRect(0, 0, W, H); } }
  function measure(){
    const sc = small.getContext('2d', {willReadFrequently:true});
    sc.clearRect(0, 0, mw, mh); sc.drawImage(ink, 0, 0, mw, mh);
    const d = sc.getImageData(0, 0, mw, mh).data;
    let cov = 0, inkN = 0, out = 0;
    for (const p of mask) if (d[p * 4 + 3] > 30) cov++;
    for (let p = 0; p < mw * mh; p++) if (d[p * 4 + 3] > 30){ inkN++; if (!tol[p]) out++; }
    return {coverage: mask.length ? cov / mask.length : 0, outside: inkN ? out / inkN : 0, inkN};
  }
  function check(pressed){
    if (won || !mask.length) return;
    const {coverage, outside, inkN} = measure();
    const relaxed = fails >= 2;
    const pass = relaxed ? coverage >= 0.42 && outside <= 0.55 : coverage >= 0.6 && outside <= 0.4;
    if (pass || (pressed && fails >= 4 && inkN > 0)){ success(); return; }
    if (!pressed) return;
    fails++; Sfx.bad(); wiggle(wrap);
    if (inkN === 0) say(T.useFinger);
    else if (outside > 0.4) say(T.stayOn);
    else say(T.keepGoing);
  }
  function success(){
    won = true; Sfx.good(); wrap.classList.add('win'); burst(wrap); drawGuide(true);
    const text = items[i];
    ctx.progress((i + 1) / items.length);
    const pr = pick(PRAISE);
    afterSay(say(pr, [pr, text.length === 1 ? soundName(text) : text]), 1300, () => { i++; if (i >= items.length) ctx.done(); else startItem(); });
  }
  function startItem(){
    won = false; fails = 0; wrap.classList.remove('win');
    const text = items[i];
    const isLetter = text.length === 1;
    topPic.textContent = isLetter ? SOUND[text][1] : (PIC[text] || '✨');
    topLabel.textContent = isLetter ? `${text}  ·  ${SOUND[text][0]}` : text;
    clearInk(); if (W) drawGuide();
    ctx.progress(i / items.length);
    const prompt = () => say(isLetter ? T.traceLetter : T.traceWord, isLetter ? [T.traceThis, soundSay(text)] : [T.traceTheWord, text]);
    ctx.replay = prompt; prompt();
  }

  function seg(a, b){
    hue = (hue + 3) % 360;
    ictx.strokeStyle = `hsl(${hue}, 85%, 55%)`; ictx.lineWidth = brush; ictx.lineCap = 'round'; ictx.lineJoin = 'round';
    ictx.beginPath(); ictx.moveTo(a.x, a.y); ictx.lineTo(b.x, b.y); ictx.stroke();
  }
  onStrokes(ink, {
    down: p => { if (won || !ictx) return false; drawing = true; last = p; seg(p, {x:p.x + 0.1, y:p.y}); },
    move: p => { if (!drawing) return; seg(last, p); last = p; },
    up: () => { if (!drawing) return; drawing = false; check(false); },
  });
  const resized = () => { const r = wrap.getBoundingClientRect(); if (Math.round(r.width) !== W || Math.round(r.height) !== H) layout(); };
  const fontReady = document.fonts && document.fonts.load ? Promise.race([document.fonts.load(font(100)), wait(2500)]) : Promise.resolve();
  fontReady.catch(() => {}).then(() => { if (!ctx.alive()) return; watchSize(wrap, resized); layout(); });
  startItem();
}

// 3 · Read words: sound out word cards, then listen & choose
function wordEl(word, magic){
  if (magic == null) magic = MAGIC_WORDS.has(word);
  const vi = magic ? firstVowel(word) : -1;
  return h('span', {class:'word'}, [...word].map((ch, k) =>
    h('span', {class:'lt' + (k === vi ? ' long' : '') + (magic && k === word.length - 1 && ch === 'e' ? ' silent' : '')}, ch)));
}
async function soundOut(we, word){
  const id = navId;
  const letters = [...we.querySelectorAll('.lt')];
  for (let k = 0; k < letters.length; k++){
    if (id !== navId) return;
    letters[k].classList.add('lit'); Sfx.tick(k);
    await wait(380);
    letters[k].classList.remove('lit');
  }
  if (id !== navId) return;
  we.classList.add('whole');
  await Speech.speak(word, {rate:0.9});
  we.classList.remove('whole');
}
function distractorWords(l, target, k){
  const out = [];
  if (l.pairs){ const p = l.pairs.find(p => p.includes(target)); if (p) out.push(p[0] === target ? p[1] : p[0]); }
  const same = w => w.toLowerCase() === target.toLowerCase() || out.includes(w);
  for (const w of shuffle(allWords(l))) if (out.length < k && !same(w)) out.push(w);
  if (out.length < k) for (const w of shuffle(uniq(LESSONS.filter(x => x.n < l.n).flatMap(allWords)))) if (out.length < k && !same(w)) out.push(w);
  if (out.length < k) for (const w of shuffle(hfWords(l))) if (out.length < k && !same(w)) out.push(w);
  return out;
}
function wordQuiz(ctx, targets, doneSteps, total, onDone){
  const l = ctx.lesson;
  const round = r => {
    if (r >= targets.length){ onDone(); return; }
    ctx.progress((doneSteps + r) / total);
    const target = targets[r];
    const opts = shuffle([target, ...distractorWords(l, target, 2)]);
    const pic = h('div', {class:'quiz-pic'}, PIC[target] || '⭐');
    const prompt = () => say(T.listenTap, [T.findWord, target]);
    let solved = false, misses = 0;
    const btns = opts.map(w => {
      const b = h('button', {class:'choice', onclick:() => {
        if (solved) return;
        if (w === target){
          solved = true; b.classList.add('right'); Sfx.good(); burst(b); pic.classList.add('show');
          ctx.progress((doneSteps + r + 1) / total);
          const pr = pick(PRAISE);
          afterSay(say(pr, [pr, target]), 1200, () => round(r + 1));
        } else {
          misses++; Sfx.bad(); wiggle(b);
          say(pick(TRY), [w, T.findWord, target]);
          if (misses >= 2) btns[opts.indexOf(target)].classList.add('hint');
        }
      }}, wordEl(w));
      return b;
    });
    ctx.stage.replaceChildren(listenBtn(prompt), pic, h('div', {class:'choices'}, btns));
    ctx.replay = prompt; prompt();
  };
  round(0);
}
function actRead(ctx){
  const l = ctx.lesson;
  if (l.pairs) return actMagic(ctx);
  const words = l.words;
  const quiz = roundList(words, 4, 6);
  const total = quiz.length + 1;
  const seen = new Set();
  const playBtn = h('button', {class:'btn green big', hidden:true, onclick:() => { Sfx.tap(); wordQuiz(ctx, quiz, 1, total, () => { ctx.progress(1); later(ctx.done, 300); }); }}, '🎮 Play ➜');
  const cards = words.map(w => {
    const we = wordEl(w, false);
    let busy = false;
    const card = h('button', {class:'word-card', 'aria-label':w, onclick:async () => {
        if (busy) return; busy = true; Sfx.tap();
        await soundOut(we, w);
        busy = false;
        if (!ctx.alive()) return;
        card.classList.add('seen'); seen.add(w);
        if (seen.size === words.length) reveal(playBtn);
      }},
      we, h('span', {class:'arrow'}, '• • ➜'), h('span', {class:'wpic'}, PIC[w] || ''));
    return card;
  });
  ctx.stage.replaceChildren(h('div', {class:'cards'}, cards), playBtn);
  ctx.progress(0);
  const intro = () => say(T.soundOut);
  ctx.replay = intro; intro();
}

// 3b · Magic e (silent-e lessons): add the e and hear the vowel change
function actMagic(ctx){
  const l = ctx.lesson, pairs = l.pairs, singles = l.words || [];
  const steps = pairs.length + singles.length;
  const quiz = shuffle(allWords(l)).slice(0, 8);
  const total = steps + quiz.length;
  let i = 0;
  const learn = () => {
    if (i >= steps){ wordQuiz(ctx, quiz, steps, total, () => { ctx.progress(1); later(ctx.done, 300); }); return; }
    ctx.progress(i / total);
    const nextBtn = h('button', {class:'btn green big', hidden:true, onclick:() => { Sfx.tap(); i++; learn(); }}, 'Next ➜');
    if (i < pairs.length){
      const [short, long] = pairs[i];
      const wordBox = h('div', {class:'magic-word'}, wordEl(short, false), h('span', {class:'eslot'}, 'e'));
      const pic = h('div', {class:'magic-pic'}, PIC[short] || '');
      let magicDone = false;
      const hear = () => magicDone
        ? say(`${short} ➜ ${long}`, [short, long])
        : say(T.tapMagic, [T.thisSays, short, T.tapMagic]);
      const wand = h('button', {class:'btn pink big wand', onclick:() => {
        if (magicDone) return;
        magicDone = true; Sfx.pop(); Sfx.good(); burst(wand); wand.hidden = true;
        const we = wordEl(long, true);
        wordBox.replaceChildren(we); bounce(we);
        pic.textContent = PIC[long] || '✨';
        reveal(nextBtn);
        say(`${short} ➜ ${long}`, [short, long, P.magicMakes(long[firstVowel(long)])]);
      }}, '✨ magic e');
      const again = h('button', {class:'btn white', onclick:() => { Sfx.tap(); hear(); }}, '🔊');
      ctx.stage.replaceChildren(h('div', {class:'magic-box'}, pic, wordBox, h('div', {class:'row'}, again, wand)), nextBtn);
      ctx.replay = hear; hear();
    } else {
      const w = singles[i - pairs.length];
      const we = wordEl(w, true);
      const hear = () => say(`${w} ✨`, [w, T.magicE]);
      ctx.stage.replaceChildren(h('div', {class:'magic-box'}, h('div', {class:'magic-pic'}, PIC[w] || '✨'), h('div', {class:'magic-word'}, we),
        h('button', {class:'btn white', onclick:() => { Sfx.tap(); bounce(we); hear(); }}, '🔊')), nextBtn);
      nextBtn.hidden = false;
      ctx.replay = hear; hear();
    }
  };
  learn();
}

// 4 · Sight words: tap the cards, then pop the bubble with the word you hear
function actSight(ctx){
  const l = ctx.lesson, words = hfWords(l);
  const pool = uniq(LESSONS.filter(x => x.n <= l.n).flatMap(hfWords));
  const order = roundList(words, 5, 8);
  const total = order.length + 1;
  const seen = new Set();
  const playBtn = h('button', {class:'btn green big', hidden:true, onclick:() => { Sfx.tap(); round(0); }}, '🔵 Play ➜');
  const cards = words.map(w => {
    const card = h('button', {class:'word-card', onclick:() => {
      Sfx.tap(); bounce(card); card.classList.add('seen'); seen.add(w);
      say(T.readWithMe, w);
      if (seen.size === words.length) reveal(playBtn);
    }}, wordEl(w, false));
    return card;
  });
  ctx.stage.replaceChildren(h('div', {class:'cards'}, cards), playBtn);
  ctx.progress(0);
  const intro = () => say(T.sightIntro);
  ctx.replay = intro; intro();

  function round(r){
    if (r >= order.length){ ctx.progress(1); later(ctx.done, 300); return; }
    ctx.progress((r + 1) / total);
    const target = order[r];
    const others = uniq([...shuffle(words), ...shuffle(pool)]).filter(w => w !== target).slice(0, 3);
    const opts = shuffle([target, ...others]);
    const colors = ['var(--teal)','var(--pink)','var(--purple)','var(--blue)'];
    const prompt = () => say(T.popWordShow, [T.popWord, target]);
    let solved = false, misses = 0;
    const bubbles = opts.map((w, k) => {
      const b = h('button', {class:'balloon bubble-word', style:{'--c':colors[(k + r) % colors.length], animationDelay:(k * 0.35) + 's'},
        onclick:() => {
          if (solved) return;
          if (w === target){
            solved = true; Sfx.pop(); Sfx.good(); b.classList.add('pop'); burst(b);
            ctx.progress((r + 2) / total);
            const pr = pick(PRAISE);
            afterSay(say(pr, [pr, target]), 1200, () => round(r + 1));
          } else {
            misses++; Sfx.bad(); wiggle(b);
            say(pick(TRY), [w, T.popWord, target]);
            if (misses >= 2) bubbles[opts.indexOf(target)].classList.add('hint');
          }
        }}, w);
      return b;
    });
    ctx.stage.replaceChildren(listenBtn(prompt), h('div', {class:'balloons bubbles'}, bubbles));
    ctx.replay = prompt; prompt();
  }
}

// 5 · Spell it (write the words + dictation): hear the word, tap the letters in order
function spellWords(l){
  if (l.pairs){ return shuffle(l.pairs).slice(0, 3).flat(); }
  let w = allWords(l);
  if (w.length < 3) w = uniq([...w, ...hfWords(l).filter(x => x.length <= 4)]);
  return shuffle(w).slice(0, 6);
}
function spellExtras(l, word, k){
  const inWord = new Set([...word.toLowerCase()]);
  const confusing = new Set(word.includes('I') ? ['l','i'] : []);
  const pool = uniq([...shuffle(l.sounds.filter(s => s.length === 1)), ...shuffle(ALPHA)]).filter(c => !inWord.has(c) && !confusing.has(c));
  return pool.slice(0, k);
}
function actSpell(ctx){
  const l = ctx.lesson, list = spellWords(l);
  const round = r => {
    if (r >= list.length){ ctx.progress(1); later(ctx.done, 300); return; }
    ctx.progress(r / list.length);
    const word = list[r], chars = [...word];
    let pos = 0, misses = 0, solved = false;
    const slots = chars.map(() => h('div', {class:'slot'}));
    const pic = h('div', {class:'spell-pic'}, PIC[word] || '👂');
    const prompt = () => say(T.spellShow, [T.spellWord, word]);
    const tiles = shuffle([...chars, ...spellExtras(l, word, word.length > 1 ? 2 : 3)]).map(ch => {
      const t = h('button', {class:'tile', onclick:() => {
        if (solved || t.classList.contains('used')) return;
        if (ch === chars[pos]){
          t.classList.add('used'); slots[pos].textContent = ch; slots[pos].classList.add('filled');
          pos++; misses = 0; Sfx.tick(pos);
          tiles.forEach(x => x.classList.remove('hint'));
          if (pos === chars.length){
            solved = true; Sfx.good(); burst(slotRow);
            ctx.progress((r + 1) / list.length);
            const pr = pick(PRAISE);
            afterSay(say(pr, [pr, ...chars.map(soundName), word]), 1400, () => round(r + 1));
          }
        } else {
          misses++; Sfx.bad(); wiggle(t);
          if (misses === 1) Speech.speak(word, {rate:0.8});
          if (misses >= 2){ const hint = tiles.find(x => !x.classList.contains('used') && x.textContent === chars[pos]); if (hint) hint.classList.add('hint'); }
        }
      }}, ch);
      return t;
    });
    const slotRow = h('div', {class:'slots'}, slots);
    ctx.stage.replaceChildren(h('div', {class:'row'}, listenBtn(prompt), pic), slotRow, h('div', {class:'tiles'}, tiles));
    ctx.replay = prompt; prompt();
  };
  round(0);
}

// 6 · Sentence: read along, then put the words in order
function actSentence(ctx){
  const l = ctx.lesson, sents = l.sentences, total = sents.length * 2;
  let readTok = 0;
  const readPhase = k => {
    ctx.progress((k * 2) / total);
    const [text, picture] = sents[k];
    const tokens = text.split(' ');
    const chips = tokens.map(t => h('button', {class:'wchip', onclick:e => {
      readTok++; chips.forEach(c => c.classList.remove('hl'));
      Sfx.tap(); bounce(e.currentTarget); Speech.speak(cleanWord(t));
    }}, t));
    const readAlong = async () => {
      const my = ++readTok, id = navId;
      for (let j = 0; j < chips.length; j++){
        if (my !== readTok || id !== navId) return;
        chips[j].classList.add('hl');
        await Speech.speak(cleanWord(tokens[j]), {rate:0.95});
        chips[j].classList.remove('hl');
        await wait(90);
      }
      if (my !== readTok || id !== navId) return;
      await wait(250);
      if (my === readTok && id === navId) Speech.speak(text, {rate:0.95});
    };
    ctx.stage.replaceChildren(
      h('div', {class:'sent-pic'}, picture),
      h('div', {class:'sentence'}, chips),
      h('div', {class:'row'},
        h('button', {class:'btn blue', onclick:() => { Sfx.tap(); readAlong(); }}, '🔊 Read to me'),
        h('button', {class:'btn green big', onclick:() => { readTok++; Sfx.good(); buildPhase(k); }}, '✅ I read it!')));
    ctx.replay = readAlong;
    const tok0 = readTok;
    say(T.readSentenceShow, T.readSentence).then(() => { if (ctx.alive() && readTok === tok0) readAlong(); });
  };
  const buildPhase = k => {
    ctx.progress((k * 2 + 1) / total);
    const [text, picture] = sents[k];
    const tokens = text.split(' ');
    let order = shuffle(tokens.map((t, idx) => idx));
    for (let tries = 0; tries < 5 && tokens.length > 1 && order.every((v, idx) => v === idx); tries++) order = shuffle(order);
    let pos = 0, misses = 0, solved = false;
    const slots = tokens.map(t => h('span', {class:'wslot', style:{minWidth:(t.length * 0.62 + 0.6) + 'em'}}));
    const prompt = () => say(T.orderShow, [T.order, text]);
    const chips = order.map(idx => {
      const t = tokens[idx];
      const c = h('button', {class:'wchip', onclick:() => {
        if (solved || c.classList.contains('used')) return;
        if (t === tokens[pos]){
          c.classList.add('used'); slots[pos].textContent = t; slots[pos].classList.add('filled');
          pos++; misses = 0; Sfx.tick(pos); chips.forEach(x => x.classList.remove('hint'));
          if (pos === tokens.length){
            solved = true; Sfx.good(); confetti(25);
            ctx.progress((k * 2 + 2) / total);
            const pr = pick(PRAISE);
            say(pr, [pr, text]).then(() => later(() => { if (k + 1 < sents.length) readPhase(k + 1); else ctx.done(); }, 500));
          } else Speech.speak(cleanWord(t));
        } else {
          misses++; Sfx.bad(); wiggle(c);
          if (misses >= 2){ const hint = chips.find(x => !x.classList.contains('used') && x.textContent === tokens[pos]); if (hint) hint.classList.add('hint'); }
        }
      }}, t);
      return c;
    });
    ctx.stage.replaceChildren(h('div', {class:'row'}, listenBtn(prompt), h('div', {class:'sent-pic small'}, picture)),
      h('div', {class:'sentence'}, slots), h('div', {class:'sentence'}, chips));
    ctx.replay = prompt; prompt();
  };
  readPhase(0);
}

// 7 · Draw and label
function actDraw(ctx){
  const l = ctx.lesson, words = allWords(l);
  const colors = ['#2b2250','#ff5a5f','#ff9f1c','#ffd23f','#22c07a','#3d8bfd','#7c5cff','#ff5fa2','#8b5a2b'];
  let color = colors[1], size = 12, erasing = false, label = '', hasInk = false, drawing = false, last = null;
  const history = [];
  const wrap = h('div', {class:'draw-wrap'});
  const cv = h('canvas', {'aria-label':'Drawing area'});
  wrap.append(cv);
  const labelEl = h('div', {class:'draw-label'}, '');
  const swatches = colors.map(c => h('button', {class:'swatch' + (c === color ? ' on' : ''), style:{background:c}, 'aria-label':'color', onclick:e => {
    Sfx.tap(); color = c; erasing = false; eraser.classList.remove('on');
    swatches.forEach(s => s.classList.remove('on')); e.currentTarget.classList.add('on');
  }}));
  const sizes = [[6, 8], [12, 14], [24, 22]].map(([s, dot]) => h('button', {class:'tool' + (s === size ? ' on' : ''), 'aria-label':'brush size', onclick:e => {
    Sfx.tap(); size = s; sizes.forEach(x => x.classList.remove('on')); e.currentTarget.classList.add('on');
  }}, h('span', {class:'dot', style:{width:dot + 'px', height:dot + 'px'}})));
  const eraser = h('button', {class:'tool', 'aria-label':'eraser', onclick:() => { Sfx.tap(); erasing = !erasing; eraser.classList.toggle('on', erasing); }}, '🧽');
  const undoBtn = h('button', {class:'tool', 'aria-label':'undo', onclick:() => { Sfx.tap(); const snap = history.pop(); if (snap) c2d.putImageData(snap, 0, 0); }}, '↩️');
  const clearBtn = h('button', {class:'tool', 'aria-label':'clear', onclick:() => { Sfx.tap(); pushHistory(); paintWhite(); hasInk = false; }}, '🗑️');
  const bank = h('div', {class:'word-bank'}, words.map(w => h('button', {class:'wchip', onclick:e => {
    Sfx.tap(); label = w; labelEl.textContent = (PIC[w] ? PIC[w] + ' ' : '') + w;
    [...bank.children].forEach(c => c.classList.remove('on')); e.currentTarget.classList.add('on');
    Speech.speak(w);
  }}, w)));
  const saveBtn = h('button', {class:'tool', 'aria-label':'save picture', onclick:() => { Sfx.tap(); savePicture(); }}, '💾');
  const doneBtn = h('button', {class:'btn green big', onclick:() => {
    if (!hasInk){ Sfx.bad(); wiggle(wrap); say(T.drawFirst); return; }
    if (!label){ Sfx.bad(); replayAnim(bank, 'nudge'); say(T.tapWordPic); return; }
    say('My picture: ' + label + '! 🎨', [T.yourPicture, label, T.greatDrawing]).then(() => later(ctx.done, 200));
  }}, '✅ Done');
  wrap.append(labelEl);
  ctx.stage.classList.add('compact');
  ctx.stage.replaceChildren(
    h('div', {class:'draw-tools'}, swatches, sizes, eraser, undoBtn, clearBtn, saveBtn),
    wrap, h('div', {class:'row'}, bank, doneBtn));
  ctx.progress(0);
  const intro = () => say(T.drawIntroShow, T.drawIntro);
  ctx.replay = intro; intro();

  let c2d = null, W = 0, H = 0, dpr = 1;
  function paintWhite(){ c2d.save(); c2d.setTransform(1, 0, 0, 1, 0, 0); c2d.fillStyle = '#fff'; c2d.fillRect(0, 0, cv.width, cv.height); c2d.restore(); }
  function pushHistory(){ try { history.push(c2d.getImageData(0, 0, cv.width, cv.height)); if (history.length > 8) history.shift(); } catch (e) {} }
  function layout(){
    const r = wrap.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const old = c2d && cv.width ? (() => { const t = document.createElement('canvas'); t.width = cv.width; t.height = cv.height; t.getContext('2d').drawImage(cv, 0, 0); return t; })() : null;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(r.width); H = Math.round(r.height);
    cv.width = W * dpr; cv.height = H * dpr;
    c2d = cv.getContext('2d');
    paintWhite();
    if (old) c2d.drawImage(old, 0, 0, cv.width, cv.height);
    c2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    history.length = 0;
  }
  function seg(a, b){
    c2d.strokeStyle = erasing ? '#fff' : color; c2d.lineWidth = erasing ? size * 2 : size;
    c2d.lineCap = 'round'; c2d.lineJoin = 'round';
    c2d.beginPath(); c2d.moveTo(a.x, a.y); c2d.lineTo(b.x, b.y); c2d.stroke();
  }
  onStrokes(cv, {
    down: p => { if (!c2d) return false; pushHistory(); drawing = true; last = p; seg(p, {x:p.x + 0.1, y:p.y}); if (!erasing) hasInk = true; },
    move: p => { if (!drawing) return; seg(last, p); last = p; },
    up: () => { drawing = false; },
  });
  function savePicture(){
    const out = document.createElement('canvas');
    out.width = cv.width; out.height = cv.height + Math.round(90 * dpr);
    const o = out.getContext('2d');
    o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height);
    o.drawImage(cv, 0, 0);
    o.fillStyle = '#7c5cff'; o.textAlign = 'center'; o.textBaseline = 'middle';
    o.font = `700 ${Math.round(44 * dpr)}px Andika, 'Comic Sans MS', sans-serif`;
    o.fillText(label || `Lesson ${l.n}`, out.width / 2, cv.height + 45 * dpr);
    out.toBlob(blob => {
      if (!blob) return;
      const a = h('a', {href:URL.createObjectURL(blob), download:`phonics-lesson-${l.n}-${label || 'picture'}.png`});
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, 'image/png');
  }
  watchSize(wrap, () => { const r = wrap.getBoundingClientRect(); if (Math.round(r.width) !== W || Math.round(r.height) !== H) layout(); });
  layout();
}

/* ---------- force refresh ---------- */
async function forceRefresh(){
  Speech.stop();
  overlay([h('div', {class:'big-star'}, '🔄'), h('h1', {}, 'Updating…'), h('p', {}, 'Getting the newest version')]);
  const base = location.pathname.replace(/[^/]*$/, '');
  const urls = [location.pathname, base + 'index.html', base + 'audio/manifest.js', base + 'fonts/andika-700-latin.woff2', base + 'fonts/fredoka-latin.woff2'];
  try {
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
    await Promise.race([Promise.all(urls.map(u => fetch(u, {cache:'reload'}).catch(() => {}))), wait(6000)]);
  } catch (e) {}
  location.replace(location.pathname + '?v=' + Date.now() + location.hash);
}

/* =====================================================================
   PHRASES — every line Leo can say (tools/build_audio.py records these)
   ===================================================================== */
const SOUND_KEYS = Object.keys(SOUND);
function globalPhrases(){
  return uniq([
    ...Object.values(T), ...PRAISE, ...TRY,
    ...SOUND_KEYS.flatMap(x => [soundName(x), P.thatIs(x), P.find(x)]),
    ...ALPHA.map(c => c.toUpperCase()),
    ...uniq(LESSONS.flatMap(l => ACTS.map(a => P.playAct(actName(l, a))))),
  ].map(norm).filter(Boolean));
}
function lessonPhrases(l){
  const name = STICKERS[l.n - 1][1];
  return uniq([
    P.lesson(l.n), P.playLesson(l.n), P.finished(l.n), P.gotSticker(name), P.aSticker(name), P.finishFor(l.n), P.haveStickers(l.n),
    ...l.sounds.flatMap(x => [soundSay(x), P.popLetter(x), P.thatIs(x), P.find(x), soundName(x)]),
    ...uniq(allWords(l).join('').split('')).map(soundName),
    ...ACTS.map(a => P.playAct(actName(l, a))),
    ...allWords(l), ...hfWords(l),
    ...(l.pairs || []).map(p => P.magicMakes(p[1][firstVowel(p[1])])),
    ...l.sentences.flatMap(([text]) => [text, ...text.split(' ').map(cleanWord)]),
  ].map(norm).filter(Boolean));
}
const allPhrases = () => uniq([...globalPhrases(), ...LESSONS.flatMap(lessonPhrases)]);
window.__phonicsPhrases = allPhrases;

/* =====================================================================
   START
   ===================================================================== */
Speech.init();
if (/[?&]v=\d+/.test(location.search)) try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (document.hidden) Speech.stop(); });
route();
overlay([
  h('div', {class:'hero-lion'}, '🦁'),
  h('h1', {}, 'Phonics Fun!'),
  h('p', {}, 'Kindergarten phonics · 25 lessons'),
  h('p', {style:{fontSize:'1.05rem', margin:'-8px 0 16px'}}, '🔊 Turn the sound on!'),
  h('div', {class:'row'}, h('button', {class:'btn green big', style:{fontSize:'2rem', minHeight:'84px'}, onclick:() => {
    audioUnlocked = true; Speech.unlock(); Sfx.ensure(); Sfx.win();
    closeOverlay();
    Speech.preload([...Object.values(T), ...PRAISE, ...TRY]);
    const greet = location.hash.length > 2 ? null : T.greet;
    if (greet) say(T.greetShow, greet).then(() => { if (lastSay && lastSay.speech === greet) route(); });
    else route();
  }}, '▶ Play')),
], 'splash');
})();
